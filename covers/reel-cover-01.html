<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .cover{width:540px;height:960px;position:relative;overflow:hidden;
    background:linear-gradient(165deg,#e6f6f3 0%,#fdf2f6 52%,#e7f3fb 100%);
    font-family:'Shippori Mincho B1','IPAGothic',serif;font-weight:800;color:#4b4650;text-align:center}
  /* 水彩のにじみ */
  .blob{position:absolute;border-radius:50%;filter:blur(38px)}
  .b1{width:380px;height:380px;left:-110px;top:-80px;background:rgba(122,210,200,.62)}
  .b2{width:330px;height:330px;right:-120px;top:270px;background:rgba(248,172,200,.50)}
  .b3{width:420px;height:420px;left:-90px;bottom:-120px;background:rgba(150,208,236,.62)}
  .b4{width:260px;height:260px;right:-60px;bottom:90px;background:rgba(246,226,170,.55)}
  .b5{width:200px;height:200px;right:-40px;top:-40px;background:rgba(250,198,214,.55)}
  .paper{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply}
  /* 金の枠 */
  .frame{position:absolute;inset:26px;border:1.5px solid rgba(201,160,70,.55);border-radius:6px}
  .frame2{position:absolute;inset:34px;border:.8px solid rgba(201,160,70,.35);border-radius:4px}
  .star{position:absolute}
  /* 文字（中央の3:4に収める） */
  .txt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%)}
  .l1,.l2{font-size:56px;line-height:1.4;letter-spacing:.05em;
    text-shadow:0 0 14px rgba(255,255,255,.95),0 0 4px rgba(255,255,255,.9)}
  .l3{margin-top:14px;font-family:'Shippori Mincho B1','IPAMincho',serif;font-weight:800;-webkit-text-stroke:3px #de5183;
    font-size:128px;line-height:1.1;letter-spacing:.01em;
    background:linear-gradient(180deg,#f0709a 0%,#d9477f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.95)) drop-shadow(0 3px 0 rgba(255,255,255,.9))}
  .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px}
  .orn i{display:block;width:70px;height:1.5px;background:linear-gradient(90deg,transparent,#c9a046)}
  .orn i:last-child{transform:scaleX(-1)}
</style></head>
<body><div class="cover">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="blob b5"></div>
  <svg class="paper" width="540" height="960"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .5 0"/></filter><rect width="540" height="960" filter="url(#n)"/></svg>
  <div class="frame"></div><div class="frame2"></div>

  <svg class="star" style="left:62px;top:150px" width="34" height="34" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8Z" fill="#d9b25c"/></svg>
  <svg class="star" style="left:96px;top:196px" width="16" height="16" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8Z" fill="#e8cf8c"/></svg>
  <svg class="star" style="right:64px;top:232px" width="26" height="26" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8Z" fill="#d9b25c"/></svg>
  <svg class="star" style="left:78px;bottom:250px" width="20" height="20" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8Z" fill="#e8cf8c"/></svg>


  <svg class="wand" style="position:absolute;left:279px;top:604px" width="260" height="260" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a0"/><stop offset="1" stop-color="#cfa44a"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="#fff6cf" stop-opacity=".95"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="62" cy="66" r="46" fill="url(#glow)"/>
    <line x1="172" y1="177" x2="76" y2="81" stroke="rgba(120,90,40,.25)" stroke-width="12" stroke-linecap="round" transform="translate(2,3)"/>
    <line x1="172" y1="177" x2="76" y2="81" stroke="#fffaf0" stroke-width="11" stroke-linecap="round"/>
    <line x1="172" y1="177" x2="76" y2="81" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <line x1="164" y1="169" x2="132" y2="137" stroke="#e8628f" stroke-width="9" stroke-linecap="butt"/>
    <line x1="118" y1="123" x2="104" y2="109" stroke="#e8628f" stroke-width="9" stroke-linecap="butt"/>
    <line x1="170" y1="175" x2="82" y2="87" stroke="#fffdf6" stroke-width="1.6" stroke-linecap="round" opacity=".8" transform="translate(-2,-2)"/>
    <polygon points="62.0,40.0 68.5,57.1 86.7,58.0 72.5,69.4 77.3,87.0 62.0,77.0 46.7,87.0 51.5,69.4 37.3,58.0 55.5,57.1" fill="#fffdf2" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="62.0,50.0 66.1,60.3 77.2,61.1 68.7,68.2 71.4,78.9 62.0,73.0 52.6,78.9 55.3,68.2 46.8,61.1 57.9,60.3" fill="#f4c95d"/>
    <path d="M24 94 L26.2 101.8 L34 104 L26.2 106.2 L24 114 L21.8 106.2 L14 104 L21.8 101.8Z" fill="#e0b866"/>
    <path d="M104 10 L106.64 19.36 L116 22 L106.64 24.64 L104 34 L101.36 24.64 L92 22 L101.36 19.36Z" fill="#e0b866"/>
    <path d="M30 27 L31.54 32.46 L37 34 L31.54 35.54 L30 41 L28.46 35.54 L23 34 L28.46 32.46Z" fill="#f0d890"/>
    <path d="M118 69 L119.54 74.46 L125 76 L119.54 77.54 L118 83 L116.46 77.54 L111 76 L116.46 74.46Z" fill="#f0d890"/>
    <path d="M20 65 L21.1 68.9 L25 70 L21.1 71.1 L20 75 L18.9 71.1 L15 70 L18.9 68.9Z" fill="#f0d890"/>
    <circle cx="96" cy="46" r="2.4" fill="#e0b866"/><circle cx="40" cy="86" r="2" fill="#e0b866"/><circle cx="86" cy="10" r="2" fill="#e0b866"/>
  </svg>
  <div class="txt">
    <div class="l1">足りないのは</div>
    <div class="l2">頑張りじゃなく</div>
    <div class="l3">「設計」</div>
    <div class="orn"><i></i>
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8Z" fill="#c9a046"/></svg><i></i></div>
  </div>
</div></body></html>
