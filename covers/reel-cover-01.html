<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .cover{width:540px;height:960px;background:#14213d;position:relative;overflow:hidden;
    font-family:'Noto Sans JP','IPAGothic',sans-serif;font-weight:900;color:#f7f3ec;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .cover::before{content:"";position:absolute;inset:28px;border:1.5px solid rgba(224,184,102,.55)}
  .l1,.l2{font-size:58px;line-height:1.35;letter-spacing:.04em}
  .l2{margin-top:6px}
  .l3{margin-top:30px;font-size:132px;line-height:1.1;color:#e0b866;letter-spacing:.02em}
  .rule{width:84px;height:3px;background:#e0b866;margin:34px 0 0}
</style></head>
<body><div class="cover">
  <div class="l1">足りないのは</div>
  <div class="l2">頑張りじゃなく</div>
  <div class="l3">「設計」</div>
  <div class="rule"></div>
</div></body></html>
