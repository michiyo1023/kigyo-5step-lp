向きません。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・だれかにやってもらうことを前提にしている方<\/p>\n<p>・情報を集めるだけで、行動はしない方<\/p>\n<p>・今すぐ楽に結果が出る方法を探している方<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>Q. 「モニター」は、何をすればいいですか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>講座を受けたあとに、感想をお聞かせいただくだけです。<\/p>\n<p>「ここがわかりやすかった」「ここはもう少し聞きたかった」<\/p>\n<p>そんな正直な声が、次の講座をつくる大切な材料になります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>反対に、<\/p>\n<p>自分に投資する覚悟があって、<\/p>\n<p>自分の力で収入を作りたいと思っている方には、<\/p>\n<p>5回で、見える景色が変わる講座です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたが1年後、どんな顔でお客様を見送っていたいか。<\/p>\n<p>一度だけ、思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「楽になりました」と笑うお客様に、<\/p>\n<p>「3か月後、楽しみですね」と、自然に返せている自分。<\/p>\n<p>お客様の未来の話を聞くのが、うれしくてたまらない自分。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その姿が少しでも浮かんだなら、きっと、もう準備はできていると思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もちろん、迷う気持ちがあって当然です。<\/p>\n<p>大事なお金と、大事な時間を使うことですから。<\/p>\n<p>だからこそ、納得して選んでほしいと思っています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>締切は【締切日】です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>▼くわしく見る・申し込む<\/p>\n<p>【申込URL】<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>足どりの軽い一日になりますように(^^)<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1748}, {"n": 8, "day": "締切の前日", "subject": "明日で、締め切ります", "text": "((friendly_name))\n\n美智代です。\n\n夜、ふとんに入ってから、スマホを手に取る。\n講座のページを開いて、パタン、と閉じる。\nまた開いて、スクロールして、パタン。\n\n部屋の中には、時計のカチ、カチ、という音だけ。\n\nもしかしたら、そんな夜をすごしている方もいるかもしれませんね。\n\nその迷いも、3通目でお話ししたブレーキかもしれません。\n新しいことをはじめるとき、脳は「本当に大丈夫？」と、そっと引きとめてくれるの。\n\nそんなときは、目を閉じて、すーっと息を吸って、はーっとはいてみてね。\nそれから、心の中で聞いてみる。\n\n「ブレーキがなかったら、私はどうしたい？」\n\n出てきた答えが、あなたの本当の気持ちだと思います。\n\n起業５ステップ講座のモニター募集は、\n明日【締切日】で締め切ります。\n\n今日は、これまでのメールを、少しだけふり返らせてください。\n\n診断を受けた日のこと、覚えていますか？\n8つの質問に、ポチ、ポチと答えていって、\n最後のボタンを押したあと、結果のメールが届くまで、少しどきどきしたと思うの。\n\n診断を受けたとき、知りたかったのは\n「なぜ、口コミが広がらないのか」\nだったと思います。\n\n結果は、寄り添いタイプでした。\n\nセッションルームで、カチャ、とティーカップを置く音。\nお客様が、ふぅっと肩の力をぬいて、\n「楽になりました」と笑って帰っていく。\nその笑顔は、本物です。\nあなたが長い時間をかけて育ててきた、聞く力の証です。\n\nただ、楽になった人は、満足して、そっと胸にしまってしまう。\n人に話したくなるのは、「私、変わったの」と言えるときでした。\n\nそのために必要だったのは、\n「3か月後、どうなっていたら最高ですか？」という問いと、\nセッションの終わりの3つの質問。\n\nそして、それを言いかけて飲みこんでしまう、脳のブレーキ。\n\nブレーキは、あなたを守ってきた味方でした。\nだから、責めずに、そっとゆるめればいい。\n\nその先に、口コミという花が咲くための、5つの順番がありました。\n\n少しだけ、3か月後を想像してみてね。\n\nいつものように、セッションの最後に聞く。\n「3か月後、どうなっていたら最高ですか？」\n\nお客様が、少し考えてから、ぽつりと答える。\nその言葉を、ノートにそのまま書きとめる。\n\n次に会ったとき、\n「前回、こんなふうに話してくれましたよね」\nと伝えると、お客様は目を丸くして、うれしそうに笑う。\n\nそして、ある日の夜。\nスマホが、ピロン、と鳴る。\n「先生、友だちが会ってみたいって言っているんですけど、紹介してもいいですか？」\n\n口コミって、こんなふうに、静かにやってくるんだと思うの。\n\n・・・ここまで読んでくださったなら、もう、答えはわかっていると思うの。\n\nあなたの腕も、がんばりも、もう十分。\n順番がまだ整っていなくて、止まる理由がほどけていないだけ。\n\nわかったうえで、どうするか。\nそれを決めるのは、あなたです。\n\n半年後も、同じところで足ぶみしていたいか。\nそれとも、お客様が自分の言葉で、あなたのことを話してくれる毎日にしたいか。\n\nどちらを選んでも、私は応援しています。\n\nもし、迷いがあるなら、その迷いもそのまま持ってきてくださいね。\n「申し込もうか迷っているんですけど」\nという一言から、はじまるご縁もたくさんあります。\n\n気になることがあれば、このメールに返信して聞いてくださっても大丈夫です。\nひとつずつ、お答えします。\n\n▼くわしく見る・申し込む\n【申込URL】\n\n今日も読んでくれて、ありがとう。\nぐっすり眠れる夜になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>夜、ふとんに入ってから、スマホを手に取る。<\/p>\n<p>講座のページを開いて、パタン、と閉じる。<\/p>\n<p>また開いて、スクロールして、パタン。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>部屋の中には、時計のカチ、カチ、という音だけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もしかしたら、そんな夜をすごしている方もいるかもしれませんね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その迷いも、3通目でお話ししたブレーキかもしれません。<\/p>\n<p>新しいことをはじめるとき、脳は「本当に大丈夫？」と、そっと引きとめてくれるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そんなときは、目を閉じて、すーっと息を吸って、はーっとはいてみてね。<\/p>\n<p>それから、心の中で聞いてみる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「ブレーキがなかったら、私はどうしたい？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>出てきた答えが、あなたの本当の気持ちだと思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>起業５ステップ講座のモニター募集は、<\/p>\n<p>明日【締切日】で締め切ります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日は、これまでのメールを、少しだけふり返らせてください。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>診断を受けた日のこと、覚えていますか？<\/p>\n<p>8つの質問に、ポチ、ポチと答えていって、<\/p>\n<p>最後のボタンを押したあと、結果のメールが届くまで、少しどきどきしたと思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>診断を受けたとき、知りたかったのは<\/p>\n<p>「なぜ、口コミが広が const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let current = store.get('tab') || Object.keys(DATA)[0];
if(!DATA[current]) current = Object.keys(DATA)[0];
const done = store.get('done') || {};

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true},1600);
}
function copy(text, btn, label, pre){
  const ok=()=>{ btn.classList.add('copied'); btn.textContent='コピーしました'; toast(label+'をコピーしました');
    setTimeout(()=>{btn.classList.remove('copied'); btn.textContent=btn.dataset.label},1800) };
  const fallback=()=>{ if(pre){ pre.parentElement.open=true; const r=document.createRange(); r.selectNodeContents(pre);
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('選択しました。コピーしてください') } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else fallback();
}
function render(){
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  for(const [key,t] of Object.entries(DATA)){
    const b=document.createElement('button'); b.className='tab'; b.type='button'; b.id='tab-'+key;
    b.setAttribute('role','tab'); b.setAttribute('aria-selected', key===current);
    b.textContent=t.name; b.onclick=()=>{current=key; store.set('tab',key); render()};
    tabs.appendChild(b);
  }
  const t=DATA[current]; const list=document.getElementById('list'); list.innerHTML='';
  let cnt=0;
  t.mails.forEach(m=>{
    const id=current+'-'+m.n; const isDone=!!done[id]; if(isDone) cnt++;
    const card=document.createElement('article'); card.className='mail'+(isDone?' done':'');
    card.innerHTML=`
      <div class="top">
        <span class="no">${m.n}通目</span><span class="day">${m.day}</span>
        <span class="chars">${m.chars.toLocaleString()}字</span>
        <label class="check"><input type="checkbox" id="chk-${id}" ${isDone?'checked':''}>貼った</label>
      </div>
      <p class="subj"></p>
      <div class="btns">
        <button class="btn primary" type="button" data-k="subject" data-label="件名をコピー">件名をコピー</button>
        <button class="btn" type="button" data-k="text" data-label="本文をコピー">本文をコピー</button>
        <button class="btn" type="button" data-k="html" data-label="本文HTMLをコピー">本文HTMLをコピー</button>
      </div>
      <details><summary>本文を見る</summary><pre></pre></details>`;
    card.querySelector('.subj').textContent=m.subject;
    const pre=card.querySelector('pre'); pre.textContent=m.text;
    card.querySelectorAll('.btn').forEach(b=>{
      const names={subject:'件名',text:'本文',html:'本文HTML'};
      b.onclick=()=>copy(m[b.dataset.k], b, m.n+'通目の'+names[b.dataset.k], b.dataset.k==='subject'?null:pre);
    });
    card.querySelector('input').onchange=e=>{ done[id]=e.target.checked; store.set('done',done); render() };
    list.appendChild(card);
  });
  document.getElementById('progress').textContent=`${t.name}：${t.mails.length}通中 ${cnt}通 貼り終わり`;
}
render();
</script>
