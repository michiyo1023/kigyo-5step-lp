<title>ステップメール貼り付け台帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1本の帳面。上でタイプを選び、1通ずつ「件名・本文」をコピーして、貼ったら印をつける */
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1f2638; --muted:#5d6577; --line:#e2ddd1;
  --navy:#1b2b4b; --gold:#a8843f; --gold-soft:#f1e7d0; --ok:#2f6b4f; --ok-soft:#e3efe7;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121722; --paper:#1a2130; --ink:#e9e6de; --muted:#a3a9b6; --line:#2c3446;
  --navy:#c9d4ec; --gold:#d6b26b; --gold-soft:#3a3221; --ok:#8fd0ad; --ok-soft:#1f3329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121722; --paper:#1a2130; --ink:#e9e6de; --muted:#a3a9b6; --line:#2c3446;
  --navy:#c9d4ec; --gold:#d6b26b; --gold-soft:#3a3221; --ok:#8fd0ad; --ok-soft:#1f3329; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;display:grid;gap:22px}
header h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0;color:var(--navy);text-wrap:balance;letter-spacing:.04em}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.steps{display:grid;gap:4px;margin:12px 0 0;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:14px}
.steps b{color:var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.tab:focus-visible,.btn:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.progress{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:14px}
.mail{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
.mail.done{background:var(--ok-soft);border-color:var(--ok)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.no{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.day{font-size:13px;font-weight:700;color:var(--navy);background:var(--gold-soft);padding:2px 10px;border-radius:999px}
.chars{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.subj{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;min-width:0;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--navy);background:transparent;color:var(--navy);padding:7px 14px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--navy);color:var(--paper)}
.btn.copied{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;padding:12px;background:var(--bg);border-radius:6px;font-family:var(--f-body);font-size:14px;line-height:1.8;max-height:360px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.mail{transition:background .2s,border-color .2s}}
</style>

<div class="wrap">
  <header>
    <h1>ステップメール貼り付け台帳</h1>
    <p>口コミタイプ診断のタイプ別ステップメール。リザストの画面と並べて、上から順に貼っていきます。</p>
    <div class="steps">
      <div><b>1.</b> リザストで、そのタイプのステップメールを開いて「メールの追加」</div>
      <div><b>2.</b> 「件名をコピー」→ 件名の欄に貼る</div>
      <div><b>3.</b> 本文の欄に貼る（HTMLの「ソース」ボタンがあれば「本文HTMLをコピー」、なければ「本文をコピー」）</div>
      <div><b>4.</b> 送る日を合わせて保存し、「貼った」に印をつける</div>
    </div>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="progress" id="progress"></div>
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = {"michishirube": {"name": "道しるべタイプ", "mails": [{"n": 1, "day": "登録の翌日", "subject": "「教える量を半分に」、試してみましたか", "text": "((friendly_name))\n\n美智代です。\n昨日は、口コミタイプ診断を受けてくれて、ありがとうございました。\n\n結果メールの最後に、ひとつだけお願いをしたの、覚えていますか？\n\n次にだれかと話すとき、教える量を半分にしてみる。\n空いた時間で、相手に話してもらう。\n\n・・・試せましたか？\n\nもし、まだなら、それで大丈夫。\n読んだ瞬間に、\n「えっ、半分？　それじゃ伝えたいことが伝わらない」\nと、ちょっとあせった人もいると思うんです。\n\n道しるべタイプの人ほど、そう感じるの。\n相手のために、わかりやすく、ていねいに伝えようとしてきた人だから。\n\n実は、私もそうでした。\n\n教員になりたてのころ、黒板いっぱいに書いて説明するのが、いい授業だと思っていたんです。\n\nカツ、カツ、カツ、とチョークの音。\nふり返ると、生徒たちは、カリカリと必死にノートを写している。\n\n授業が終わると、黒板は真っ白な文字でうめつくされていて、\n「今日も、全部伝えられた」\nと、ほっとしていました。\n\nでも、次の週に同じところを聞くと、ほとんどの子が覚えていなかったの。\n\n変わったのは、塾で教えるようになってからでした。\n\nあるとき、説明を半分で止めて、生徒にこう聞いてみたんです。\n「じゃあ、今のところ、先生に説明してみて」\n\n生徒は、えーっと、と言いながら、たどたどしく話しはじめる。\nまちがえたり、言いよどんだりしながら、自分の言葉で。\n\nその子は、次の週も、ちゃんと覚えていました。\n\n・・・あのころの私は、「伝える」ところで満足していたんだと思う。\n\nたとえば、旅行のガイドさんを思い浮かべてみてね。\n\nひとりは、バスの中で、マイクを持って、名所の歴史をずっと話してくれるガイドさん。\nくわしくて、物知りで、「へぇ」と何度も感心する。\n\nもうひとりは、ときどきマイクを置いて、\n「みなさん、ここで何がいちばん見たいですか？」\nと聞いてくれるガイドさん。\n\nどちらも、すてきなガイドさんです。\nでも、旅のあとで、友だちに話したくなるのは、たぶん後のほう。\n\nなぜなら、その旅が「自分の旅」になったから。\n人は、自分で話したことのほうを、ずっとよく覚えているんです。\n\n教える量を半分にすると、空いたところに、お客様の言葉が入ってきます。\n\n「私の場合は、こうかもしれない」\n「それなら、明日これをやってみようかな」\n\nそうやって、お客様が自分の口で話したことが、\nそのまま、その人の「変化」の始まりになるの。\n\n道しるべタイプの人は、知識も、伝える力も、もう十分に持っています。\nだから、半分にしても、大事なところはちゃんと届く。\nむしろ、半分にしたほうが、届くんです。\n\n「でも、どこを削ればいいのかわからない」という人へ。\nむずかしく考えなくて大丈夫。3つだけ試してみてね。\n\n1つめ。結論を、いちばん先に言う。\n理由や背景は、聞かれたら話せばいいの。\n\n2つめ。例は、ひとつだけにする。\n3つ用意していたら、いちばん伝わりそうなものを残して、2つはそっとしまっておく。\n\n3つめ。話の途中で、一度マイクを置く。\n「ここまでで、どう感じましたか？」\nと聞いて、相手が話しはじめるのを、ゆっくり待つ。\n\nこの3つだけで、話す量は、自然と半分くらいになります。\nそして、相手の顔が、ふっと前を向くのがわかると思うの。\n\nたとえば、あるヨガの先生。\nポーズのたびに、骨の名前や筋肉のしくみを、ていねいに説明していました。\n\nある日、説明を半分にして、こう聞いてみたそうです。\n「今のポーズ、からだのどこが気持ちよかったですか？」\n\nシーンとしていたスタジオに、\n「・・・背中が、じんわりあったかいです」\n「私は、肩がすーっと軽くなった」\nと、ぽつぽつ声が上がりはじめた。\n\nその日から、生徒さんの「また来たい」が、目に見えて増えたそうです。\n\nあなたが次に話すとき、どこで、そっとマイクを置いてみますか？\n\n明日は、お客様に話してもらったあと、どう終わるかをお話しします。\n\n今日も読んでくれて、ありがとう。\n肩の力がふっとぬける一日になりますように(^^)\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p>昨日は、口コミタイプ診断を受けてくれて、ありがとうございました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>結果メールの最後に、ひとつだけお願いをしたの、覚えていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>次にだれかと話すとき、教える量を半分にしてみる。<\/p>\n<p>空いた時間で、相手に話してもらう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・・・試せましたか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もし、まだなら、それで大丈夫。<\/p>\n<p>読んだ瞬間に、<\/p>\n<p>「えっ、半分？　それじゃ伝えたいことが伝わらない」<\/p>\n<p>と、ちょっとあせった人もいると思うんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>道しるべタイプの人ほど、そう感じるの。<\/p>\n<p>相手のために、わかりやすく、ていねいに伝えようとしてきた人だから。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>実は、私もそうでした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>教員になりたてのころ、黒板いっぱいに書いて説明するのが、いい授業だと思っていたんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>カツ、カツ、カツ、とチョークの音。<\/p>\n<p>ふり返ると、生徒たちは、カリカリと必死にノートを写している。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>授業が終わると、黒板は真っ白な文字でうめつくされていて、<\/p>\n<p>「今日も、全部伝えられた」<\/p>\n<p>と、ほっとしていました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>でも、次の週に同じところを聞くと、ほとんどの子が覚えていなかったの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>変わったのは、塾で教えるようになってからでした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あるとき、説明を半分で止めて、生徒にこう聞いてみたんです。<\/p>\n<p>「じゃあ、今のところ、先生に説明してみて」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>生徒は、えーっと、と言いながら、たどたどしく話しはじめる。<\/p>\n<p>まちがえたり、言いよどんだりしながら、自分の言葉で。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その子は、次の週も、ちゃんと覚えていました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・・・あのころの私は、「伝える」ところで満足していたんだと思う。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>たとえば、旅行のガイドさんを思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ひとりは、バスの中で、マイクを持って、名所の歴史をずっと話してくれるガイドさん。<\/p>\n<p>くわしくて、物知りで、「へぇ」と何度も感心する。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もうひとりは、ときどきマイクを置いて、<\/p>\n<p>「みなさん、ここで何がいちばん見たいですか？」<\/p>\n<p>と聞いてくれるガイドさん。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>どちらも、すてきなガイドさんです。<\/p>\n<p>でも、旅のあとで、友だちに話したくなるのは、たぶん後のほう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>なぜなら、その旅が「自分の旅」になったから。<\/p>\n<p>人は、自分で話したことのほうを、ずっとよく覚えているんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>教える量を半分にすると、空いたところに、お客様の言葉が入ってきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「私の場合は、こうかもしれない」<\/p>\n<p>「それなら、明日これをやってみようかな」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そうやって、お客様が自分の口で話したことが、<\/p>\n<p>そのまま、その人の「変化」の始まりになるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>道しるべタイプの人は、知識も、伝える力も、もう十分に持っています。<\/p>\n<p>だから、半分にしても、大事なところはちゃんと届く。<\/p>\n<p>むしろ、半分にしたほうが、届くんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「でも、どこを削ればいいのかわからない」という人へ。<\/p>\n<p>むずかしく考えなくて大丈夫。3つだけ試してみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1つめ。結論を、いちばん先に言う。<\/p>\n<p>理由や背景は、聞かれたら話せばいいの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>2つめ。例は、ひとつだけにする。<\/p>\n<p>3つ用意していたら、いちばん伝わりそうなものを残して、2つはそっとしまっておく。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>3つめ。話の途中で、一度マイクを置く。<\/p>\n<p>「ここまでで、どう感じましたか？」<\/p>\n<p>と聞いて、相手が話しはじめるのを、ゆっくり待つ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この3つだけで、話す量は、自然と半分くらいになります。<\/p>\n<p>そして、相手の顔が、ふっと前を向くのがわかると思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>たとえば、あるヨガの先生。<\/p>\n<p>ポーズのたびに、骨の名前や筋肉のしくみを、ていねいに説明していました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ある日、説明を半分にして、こう聞いてみたそうです。<\/p>\n<p>「今のポーズ、からだのどこが気持ちよかったですか？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>シーンとしていたスタジオに、<\/p>\n<p>「・・・背中が、じんわりあったかいです」<\/p>\n<p>「私は、肩がすーっと軽くなった」<\/p>\n<p>と、ぽつぽつ声が上がりはじめた。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その日から、生徒さんの「また来たい」が、目に見えて増えたそうです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたが次に話すとき、どこで、そっとマイクを置いてみますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、お客様に話してもらったあと、どう終わるかをお話しします。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>肩の力がふっとぬける一日になりますように(^^)<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1761}, {"n": 2, "day": "2日後", "subject": "「わかった」を「変わった」に変える、セッションの終わり方", "text": "((friendly_name))\n\n美智代です。\n\n昨日の「教える量を半分に」は、できそうですか？\n\n今日は、その続きのお話です。\n\nちょっと、はじめて入るレストランを思い浮かべてみてね。\n\n席につくと、店員さんが、ドサッと分厚いメニューを置いていく。\nパラ、パラ、とページをめくる。\n前菜だけで20種類、パスタが30種類、デザートが15種類。\n\nどれもおいしそう。\nでも、だんだん決められなくなってくる。\n\n「・・・とりあえず、いつものにしようかな」\n\nけっきょく、いつもと同じものを頼んでしまう。\n\nもう1軒のお店では、店員さんが、こう聞いてくれるの。\n\n「今日は、どんな気分ですか？　さっぱりしたもの？　しっかり食べたい感じ？」\n\n答えると、\n「それなら、今日はこちらがおすすめです」\nと、ひとつだけ教えてくれる。\n\nこちらのお店のほうが、迷わずに決められる。\nそして、食べ終わったあと、「あのお店、いいよ」と話したくなるのも、こっちだと思うんです。\n\n人の脳は、選べるものが多すぎると、決めることをやめてしまうの。\n結果メールでお伝えした、「考えておきます」の正体です。\n\n・・・セッションも、同じだと思うんです。\n\n実は、私もセミナーの資料を、30ページも作っていたことがありました。\n\n伝えたいことが、次から次へと出てくる。\nあれも大事、これも知っておいてほしい。\n気づけば、スライドをカチ、カチとめくるだけで、時間がいっぱいになっていたの。\n\n参加者さんは「すごく勉強になりました」と言ってくれる。\nでも、そのあと、だれも動いていなかったんです。\n\nそれからは、終わる5分前に、3つのことだけをするようにしました。\n\n1つめ。今日、いちばん心に残ったことを、ひとつだけ言ってもらう。\n「今日のお話で、いちばん心に残ったのはどこですか？」\n\n2つめ。その言葉を、そのまま返す。\n「『お客様の声を集める順番』が、いちばん残ったんですね」\n\n3つめ。最初の一歩を、ひとつだけ選んでもらう。\n「明日から、まず何をしてみますか？」\n\nポイントは、「ひとつだけ」なの。\n\n10個の学びを持ち帰るより、\nひとつの行動を持ち帰ったほうが、人は動けます。\n\n教員をしていたころ、夏休みの宿題で、それを思い知りました。\n\nあれもこれもと、プリントを10種類出した年。\n9月に集めてみると、最後まで終わっている子は、ほんのひとにぎりでした。\n\n次の年は、思いきって、\n「毎日、日記を3行だけ書いてきてね」\nとだけ伝えたんです。\n\n9月1日。\nパラパラとノートをめくると、ほとんどの子が、夏休みのあいだ、ちゃんと書き続けていました。\n花火の音、スイカの甘さ、おばあちゃんの家のにおい。\n3行の中に、その子だけの夏がつまっていたの。\n\n人は、ひとつなら、続けられるんです。\n\n実際のセッションだと、こんな感じです。\n\n「今日のお話で、いちばん心に残ったのはどこですか？」\n\n「・・・お客様の変化を、先に見せるっていうところです」\n\n「お客様の変化を、先に見せる。そこが残ったんですね」\n\n「はい。私、いつも自分の資格の話から始めていたなって」\n\n「明日から、まず何をしてみますか？」\n\n「インスタのプロフィールに、お客様の変化を一行だけ書いてみます」\n\nこの方が帰り道に考えているのは、30ページの内容よりも、\n「プロフィールの一行」\nなんです。\n\nそして、1か月後。\nその一行を見たお客様から、ピロン、とメッセージが届く。\n「プロフィールを見て、私も同じ悩みだったのでご連絡しました」\n\n自分の言葉で持ち帰った一歩は、ちゃんと形になるの。\n形になった変化は、人に話せます。\n\nあなたのセッションは、いつも、どんな言葉で終わっていますか？\n\n・・・ただ、ここまで読んで、\n「わかる。でも、まだ自分の知識が足りない気がして、削るのがこわい」\nと感じた人もいると思うの。\n\n明日は、その「こわさ」の正体をお話ししますね。\n\n今日も読んでくれて、ありがとう。\n迷わず選べる一日になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日の「教える量を半分に」は、できそうですか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日は、その続きのお話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちょっと、はじめて入るレストランを思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>席につくと、店員さんが、ドサッと分厚いメニューを置いていく。<\/p>\n<p>パラ、パラ、とページをめくる。<\/p>\n<p>前菜だけで20種類、パスタが30種類、デザートが15種類。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>どれもおいしそう。< n<p><br /><\/p>\n<p>人は、ひとつなら、続けられるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>実際のセッションだと、こんな感じです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「今日のお話で、いちばん心に残ったのはどこですか？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「・・・お客様の変化を、先に見せるっていうところです」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「お客様の変化を、先に見せる。そこが残ったんですね」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「はい。私、いつも自分の資格の話から始めていたなって」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「明日から、まず何をしてみますか？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「インスタのプロフィールに、お客様の変化を一行だけ書いてみます」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この方が帰り道に考えているのは、30ページの内容よりも、<\/p>\n<p>「プロフィールの一行」<\/p>\n<p>なんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そして、1か月後。<\/p>\n<p>その一行を見たお客様から、ピロン、とメッセージが届く。<\/p>\n<p>「プロフィールを見て、私も同じ悩みだったのでご連絡しました」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>自分の言葉で持ち帰った一歩は、ちゃんと形になるの。<\/p>\n<p>形になった変化は、人に話せます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたのセッションは、いつも、どんな言葉で終わっていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・・・ただ、ここまで読んで、<\/p>\n<p>「わかる。でも、まだ自分の知識が足りない気がして、削るのがこわい」<\/p>\n<p>と感じた人もいると思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、その「こわさ」の正体をお話ししますね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>迷わず選べる一日になりますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1726}, {"n": 3, "day": "3日後", "subject": "「もっと学べば、自信を持って出せるはず」", "text": "((friendly_name))\n\n美智代です。\n\n洋服屋さんの試着室で、こんな経験はありませんか？\n\nシャッ、とカーテンを閉めて、服を着てみる。\n鏡の前で、くるっと回る。\n\nうん、似合っている気がする。\nでも、カーテンを開けて、店員さんに見せる勇気が出ない。\n\n「もう少し、ここがこうだったら」\n「別のサイズも、着てみようかな」\n\n気づけば、試着室の中で、何着も着がえている。\n外では、店員さんが、\n「いかがですか〜？」\nと、待っている・・・(;'∀')\n\n今日は、そんなお話です。\n\n新しい講座の案内が、ピロンとスマホに届く。\n「これを学べば、もっと自信を持って伝えられるかもしれない」\n気づくと、申し込みボタンを押している。\n\n学ぶのは、楽しい。\n学んでいる間は、前に進んでいる気がする。\n\nでも、心のどこかで分かっている。\nこの知識も、たぶん、また外に出さずにしまってしまう。\n\nそんな日が、何度もあったと思うんです。\n\n私にも、ありました。\n\n資格をとったとき、\n「これで、やっと人に教えられる」\nと思ったはずなのに、いざ講座を開こうとすると、\n「でも、まだ足りない気がする」\nと、次の講座を探していたの。\n\n本棚には、テキストがずらっと並んでいく。\nノートも、どんどん増えていく。\nでも、自分の講座の募集ページは、いつまでも下書きのままでした。\n\nあとになって、脳のしくみを学んだとき、やっとわかったんです。\n\n脳は、「まだ準備ができていない」状態を、安全だと感じるようにできているの。\n外に出して評価されるより、学び続けているほうが、傷つかずにすむから。\n\nまじめな人ほど、このブレーキは強くなります。\n「中途半端なものを出したら、迷惑をかける」\nそう考えるやさしさが、試着室のカーテンを、ぎゅっとにぎらせるんです。\n\n教える量がふくらんでしまうのも、同じところから来ているのかもしれません。\nたくさん伝えておけば、「足りない」と言われずにすむ。\n説明の多さは、自分を守る鎧のようなものなの。\n\nこのブレーキは、からだにも出てきます。\n\n募集ページを公開しようとした瞬間、指がピタッと止まる。\n「あと1か所だけ、直してから」と、また下書きに戻る。\n資料のページ数が、気づくとまた増えている。\n\n思い当たるもの、ありましたか？\n\nここで、ひとつ大事なことがあります。\n\nブレーキは、味方なの。\n今まで、あなたが人に迷惑をかけないように、ちゃんと守ってきてくれたもの。\n\nだから、自分を責めなくていいんです。\n必要なのは、ブレーキを外すことより、そっとゆるめること。\n\n私は、脳科学の認定を受けて、このしくみを教えています。\nそして、このブレーキをゆるめる方法を「マインドチューニング」と呼んでいます。\n\n楽器の調律のように、少しずつ音を合わせていくイメージです。\n\nブレーキがゆるむと、今ある知識のままで、外に出せるようになります。\n自信は、出したあとに、あとからついてくるものなの。\n\n私が、今いちばん大切にしている言葉があります。\n\n「7割で出して、走りながら整える」\n\n完璧になるまで待っていたら、そのあいだに、あなたを待っているお客様は、ほかの人のところへ行ってしまう。\n7割でも、あなたの知識は、だれかの道しるべになります。\n残りの3割は、お客様の声を聞きながら、一緒に仕上げていけばいいの。\n\n今日、ひとつだけ、小さな練習をしてみませんか。\n\n今、下書きのまま置いてあるものを、ひとつ思い浮かべてみてね。\nブログの記事、講座の案内、プロフィールの一文。\n\nそれを、7割のままでいいので、だれかひとりに見せてみる。\n家族でも、友だちでも大丈夫です。\n\nカーテンを、シャッと開けてみる。\n外の空気は、思っていたより、ずっとやさしいはずです。\n\nあなたの試着室には、今、どんな服がかかっていますか？\n\n明日は、少しだけ私の話をさせてください。\n教員として、1万人以上の生徒さんと向き合う中で見てきた、ある光景の話です。\n\n今日も読んでくれて、ありがとう。\nカーテンを開けたくなる一日になりますように(^^)\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>洋服屋さんの試着室で、こんな経験はありませんか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>シャッ、とカーテンを閉めて、服を着てみる。<\/p>\n<p>鏡の前で、くるっと回る。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>うん、似合っている気がする。<\/p>\n<p>でも、カーテンを開けて、店員さんに見せる勇気が出ない。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「もう少し、ここがこうだったら」<\/p>\n<p>「別のサイズも、着てみようかな」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>気づけば、試着室の中で、何着も着がえている。<\/p>\n<p>外では、店員さんが、<\/p>\n<p>「いかがですか〜？」<\/p>\n<p>と、待っている・・・(;'∀')<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日は、そんなお話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>新しい講座の案内が、ピロンとスマホに届く。<\/p>\n<p>「これを学べば、もっと自信を持って伝えられるかもしれない」<\/p>\n<p>気づくと、申し込みボタンを押している。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>学ぶのは、楽しい。<\/p>\n<p>学んでいる間は、前に進んでいる気がする。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>でも、心のどこかで分かっている。<\/p>\n<p>この知識も、たぶん、また外に出さずにしまってしまう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そんな日が、何度もあったと思うんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私にも、ありました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>資格をとったとき、<\/p>\n<p>「これで、やっと人に教えられる」<\/p>\n<p>と思ったはずなのに、いざ講座を開こうとすると、<\/p>\n<p>「でも、まだ足りない気がする」<\/p>\n<p>と、次の講座を探していたの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>本棚には、テキストがずらっと並んでいく。<\/p>\n<p>ノートも、どんどん増えていく。<\/p>\n<p>でも、自分の講座の募集ページは、いつまでも下書きのままでした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あとになって、脳のしくみを学んだとき、やっとわかったんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>脳は、「まだ準備ができていない」状態を、安全だと感じるようにできているの。<\/p>\n<p>外に出して評価されるより、学び続けているほうが、傷つかずにすむから。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>まじめな人ほど、このブレーキは強くなります。<\/p>\n<p>「中途半端なものを出したら、迷惑をかける」<\/p>\n<p>そう考えるやさしさが、試着室のカーテンを、ぎゅっとにぎらせるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>教える量がふくらんでしまうのも、同じところから来ているのかもしれません。<\/p>\n<p>たくさん伝えておけば、「足りない」と言われずにすむ。<\/p>\n<p>説明の多さは、自分を守る鎧のようなものなの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>このブレーキは、からだにも出てきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>募集ページを公開しようとした瞬間、指がピタッと止まる。<\/p>\n<p>「あと1か所だけ、直してから」と、また下書きに戻る。<\/p>\n<p>資料のページ数が、気づくとまた増えている。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>思い当たるもの、ありましたか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ここで、ひとつ大事なことがあります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ブレーキは、味方なの。<\/p>\n<p>今まで、あなたが人に迷惑をかけないように、ちゃんと守ってきてくれたもの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>だから、自分を責めなくていいんです。<\/p>\n<p>必要なのは、ブレーキを外すことより、そっとゆるめること。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私は、脳科学の認定を受けて、このしくみを教えています。<\/p>\n<p>そして、このブレーキをゆるめる方法を「マインドチューニング」と呼んでいます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>楽器の調律のように、少しずつ音を合わせていくイメージです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ブレーキがゆるむと、今ある知識のままで、外に出せるようになります。<\/p>\n<p>自信は、出したあとに、あとからついてくるものなの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私が、今いちばん大切にしている言葉があります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「7割で出して、走りながら整える」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>完璧になるまで待っていたら、そのあいだに、あなたを待っているお客様は、ほかの人のところへ行ってしまう。<\/p>\n<p>7割でも、あなたの知識は、だれかの道しるべになります。<\/p>\n<p>残りの3割は、お客様の声を聞きながら、一緒に仕上げていけばいいの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日、ひとつだけ、小さな練習をしてみませんか。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今、下書きのまま置いてあるものを、ひとつ思い浮かべてみてね。<\/p>\n<p>ブログの記事、講座の案内、プロフィールの一文。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>それを、7割のままでいいので、だれかひとりに見せてみる。<\/p>\n<p>家族でも、友だちでも大丈夫です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>カーテンを、シャッと開けてみる。<\/p>\n<p>外の空気は、思っていたより、ずっとやさしいはずです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたの試着室には、今、どんな服がかかっていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、少しだけ私の話をさせてください。<\/p>\n<p>教員として、1万人以上の生徒さんと向き合う中で見てきた、ある光景の話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>カーテンを開けたくなる一日になりますように(^^)<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1750}, {"n": 4, "day": "4日後", "subject": "放課後の教室で、何度も見てきた光景", "text": "((friendly_name))\n\n美智代です。\n\n昨日は、「試着室のカーテン」のお話をしました。\n今日は約束どおり、少しだけ私の話をさせてくださいね。\n\n私は、20年以上、教員をしていました。\n個別指導の塾も経営してきて、向き合ってきた生徒さんは、1万人を超えます。\n\nその中で、何度も見てきた光景があるんです。\n\nテストの時間。\nキーンコーンカーンコーン、とチャイムが鳴って、\nいっせいに、ペラッと問題用紙がめくられる。\n\n教室の中は、カリカリ、カリカリと、鉛筆の音だけがひびいている。\n\nその中で、ひとりだけ、鉛筆がピタッと止まっている子がいるの。\n\nいつも、いちばんていねいにノートをとっている子。\n宿題も、毎回きちんと出してくる子。\n授業中に当てると、ちゃんと答えられる子です。\n\nなのに、テストになると、手が止まる。\n\nあとで答案を返すと、空欄だったところを、その子はすらすら解いてみせるんです。\n\n「わかってたの？」と聞くと、\n「・・・まちがえたらどうしようって思ったら、書けなくなって」\n\n最初のころの私は、その子に、もっと問題を解かせていました。\n練習すれば、自信がつくと思っていたから。\n\nでも、いくら問題を増やしても、テストの日になると、鉛筆はまた止まってしまう。\n\n変わったのは、ある日の放課後でした。\n\n夕方の教室。\n窓から、オレンジ色の光がさしこんでいて、遠くで吹奏楽部のトランペットが、パーッと鳴っていた。\n\nその子と、ふたりで話したんです。\n「まちがえたら、どうなると思う？」\n\nその子は、少し考えてから、ぽつりと言いました。\n「・・・お母さんが、がっかりする」\n\nああ、そうだったんだ、と思いました。\nこの子の鉛筆を止めていたのは、\n「がっかりさせたくない」という、やさしい気持ちだったんです。\n\nそのことを一緒に言葉にして、\n「まちがえても、お母さんはがっかりしないと思うよ」\nと話してから、その子の答案は、少しずつ埋まるようになりました。\n\n最初は、1問だけ。\n次のテストでは、3問。\n学期の終わりには、カリカリ、カリカリと、ほかの子と同じリズムで鉛筆が動いていました。\n\nテストを返す日、その子が答案を受け取って、ふっと笑ったんです。\n点数よりも、その笑顔のほうを、私は今でもよく覚えています。\n\n問題の数を増やしても変わらなかったのに、\n止まる理由に気づいたとたん、手が動きはじめた。\n\nあのとき、教えることと、ほどくことは、まったく別の力なんだと知りました。\n\n・・・起業してから、私は同じ光景にもう一度出会いました。\n\n学んでいる女性ほど、止まっている。\n\n資格もある。知識もある。\nお客様にも、ちゃんと喜ばれている。\nなのに、いちばん大事な場面で、鉛筆がピタッと止まる。\n\n実は、私自身もそうでした。\n起業したばかりのころ、「まだ足りない」と思って、講座を次々に受けていたんです。\n学んでいる間は、前に進んでいる気がして、安心できたから。\n\n新しい講座の案内が、ピロンとスマホに届くたびに、\n「これを学べば、きっと変われる」\nと、わくわくしながら申し込みボタンを押していました。\n\n手元のノートは、どんどん増えていく。\nでも、お客様の数は、なかなか増えなかったんです。\n\nでも、ふり返ってみると、足りなかったのは知識の量よりも、2つのことだったと思うの。\n\nひとつは、止まる理由に気づいて、そっとほどくこと。\nもうひとつは、学んできたことを、正しい順番で組み立て直すこと。\n\nこの2つがそろったとき、人は、がんばらなくても進めるようになります。\n\n道しるべタイプの人の「伝える力」は、もう十分に育っています。\nあとは、それを生かす順番を知るだけ。\n\nたとえば、ある講師さん。\nどんなにこみ入った話も、図や例えを使って、すっきり整理して伝えられる方でした。\n\n資料は、いつも30ページ。\n参加者さんは、ペンをカリカリ走らせながら、うんうんとうなずいている。\nでも、最後は決まって、\n「勉強になりました。考えておきます」\nで終わってしまう。\n\n1〜3通目でお話しした、あの場面です。\n\nこの方に必要だったのは、次の資格よりも、\n「伝える力を、どの順番で生かすか」\nという地図でした。\n\nそれが見えたとたん、同じ伝える力が、\nお客様が自分の足で一歩をふみ出すための、道しるべに変わっていったんです。\n\nあなたの鉛筆が止まるのは、どんな場面でしょう。\n\n明日は、その「順番」のお話をします。\n口コミは、実は、いちばん最後に咲く花なんです。\n\n今日も読んでくれて、ありがとう。\n夕焼けがきれいな一日になりますように(^^)\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日は、「試着室のカーテン」のお話をしました。<\/p>\n<p>今日は約束どおり、少しだけ私の話をさせてくださいね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私は、20年以上、教員をしていました。<\/p>\n<p>個別指導の塾も経営してきて、向き合ってきた生徒さんは、1万人を超えます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その中で、何度も見てきた光景があるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>テストの時間。<\/p>\n<p>キーンコーンカーンコーン、とチャイムが鳴って、<\/p>\n<p>いっせいに、ペラッと問題用紙がめくられる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>教室の中は、カリカリ、カリカリと、鉛筆の音だけがひびいている。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その中で、ひとりだけ、鉛筆がピタッと止まっている子がいるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>いつも、いちばんていねいにノートをとっている子。<\/p>\n<p>宿題も、毎回きちんと出してくる子。<\/p>\n<p>授業中に当てると、ちゃんと答えられる子です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>なのに、テストになると、手が止まる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あとで答案を返すと、空欄だったところを、その子はすらすら解いてみせるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「わかってたの？」と聞くと、<\/p>\n<p>「・・・まちがえたらどうしようって思ったら、書けなくなって」<\/p>\n<p><br / <br /><\/p>\n<p>この2つがそろったとき、人は、がんばらなくても進めるようになります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>道しるべタイプの人の「伝える力」は、もう十分に育っています。<\/p>\n<p>あとは、それを生かす順番を知るだけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>たとえば、ある講師さん。<\/p>\n<p>どんなにこみ入った話も、図や例えを使って、すっきり整理して伝えられる方でした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>資料は、いつも30ページ。<\/p>\n<p>参加者さんは、ペンをカリカリ走らせながら、うんうんとうなずいている。<\/p>\n<p>でも、最後は決まって、<\/p>\n<p>「勉強になりました。考えておきます」<\/p>\n<p>で終わってしまう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1〜3通目でお話しした、あの場面です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この方に必要だったのは、次の資格よりも、<\/p>\n<p>「伝える力を、どの順番で生かすか」<\/p>\n<p>という地図でした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>それが見えたとたん、同じ伝える力が、<\/p>\n<p>お客様が自分の足で一歩をふみ出すための、道しるべに変わっていったんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたの鉛筆が止まるのは、どんな場面でしょう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、その「順番」のお話をします。<\/p>\n<p>口コミは、実は、いちばん最後に咲く花なんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>夕焼けがきれいな一日になりますように(^^)<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1968}, {"n": 5, "day": "5日後", "subject": "口コミは、いちばん最後に咲く花", "text": "((friendly_name))\n\n美智代です。\n\n昨日は、放課後の教室のお話でした。\n今日は、「順番」のお話です。\n\nちょっと、庭で花を育てるところを思い浮かべてみてね。\n\n春に、きれいな花を咲かせたい。\nそう思ったら、まず何をするでしょう。\n\nザクッ、ザクッと、スコップで土をほりかえす。\nふかふかの土に、小さな種をそっとまく。\nじょうろで、シャーッと水をあげる。\n\nしばらくすると、土の中から、小さな芽がぴょこんと顔を出す。\n葉っぱが増えて、つぼみがふくらんで・・・\nある朝、ふわっと花がひらく。\n\n花は、いちばん最後なんです。\n\nところが、「口コミを増やしたい」と思ったとき、\n多くの人は、花の飾り方から探しはじめます。\n\n紹介キャンペーン。\nお客様の声の集め方。\nSNSでシェアしてもらうお願いの仕方。\n\nどれも、まちがってはいないの。\nでも、土や種がまだ整っていないところに、いくら飾りつけをしても、花は咲かないんです。\n\n口コミが自然に起きている人には、その前に、こんな順番があります。\n\n1つめ。自分が、なぜこの仕事をするのかという「軸」がある。\n花でいえば、日当たりのいい場所を選ぶこと。ここがずれると、何を植えても育ちにくいの。\n\n2つめ。お客様が申し込むまでの「流れ」を知っている。\n水やりの道すじです。どこに、いつ、どれくらい水をあげるかがわかっている。\n\n3つめ。「だれの、何を変えるのか」が、ひとことで言える。\n花壇に立てる名札のようなもの。通りかかった人が、「あ、ここは〇〇の花壇なんだ」とすぐにわかる。\n\n4つめ。商品が「お客様の変化」でできている。\nこれが、種そのものです。\n\n5つめ。自分に合った「届け方」をしている。\n植える季節を選ぶこと。春に強い花もあれば、秋に咲く花もあるの。\n\nこの順番が整うと、お客様は「変わった」と感じます。\nそして、自分の変化を、自分の言葉で、人に話しはじめるの。\nそれが、口コミという花です。\n\n道しるべタイプの人が止まりやすいのも、4つめだと思っています。\n\n伝えるのは、とても上手。\nでも、商品が「知識の量」でできていて、「お客様が変わる道のり」になっていないことが多いんです。\n\n知識は、受けとった瞬間に「わかった」で終わります。\n変わる道のりには、「明日から、まずこれをやる」という一歩がある。\n\n1〜3通目でお話しした「教える量を半分に」と「明日から、まず何をしてみますか？」は、\n実は、この4つめを整えるための練習でもあったの。\n\nちょっとだけ、ご自分の商品を思い浮かべてみてね。\n\n・お客様が受けたあと、何がどう変わるか、ひとことで言えますか？\n・その変化は、1回で終わりますか？　それとも、続いていきますか？\n・受けたあと、お客様が最初にやる一歩は、はっきりしていますか？\n\nもし、どれかで「うーん」と手が止まったなら、\nそこが、種を植え直すところなのかもしれません。\n\n手が止まったのは、気づけたしるし。\n気づけた人から、庭は少しずつ変わっていきます。\n\n私も、最初に作った講座は、知識をぎゅうぎゅうにつめこんだ6回講座でした。\n毎回、分厚いテキストをドサッと配って、時間いっぱい説明する。\n「すごく勉強になりました」と言ってもらえる。でも、だれも動かない。\n「知識の量」を売っていたんだと、あとになって気づきました。\n\nそこで、講座を「一歩ずつ進む道のり」に作り直したんです。\n\n1回目は、お客様が今どこにいるかを、一緒に確かめる。\n2回目は、行きたい場所を、お客様の言葉で決める。\n3回目からは、毎回「次の一歩」をひとつだけ選んで、次の回までにやってきてもらう。\n\n伝えていることは、ほとんど変わらないの。\n整理して、順番を見せて、わかりやすく伝える。\n道しるべタイプの得意なことばかりです。\n\nちがったのは、お客様の帰り道の表情でした。\n「勉強になった」という顔から、\n「次までに、これをやってみよう」という顔に変わったんです。\n\nそして3か月後。\n「最近ね、こんなことができるようになったの」\nと、お客様のほうから、うれしそうに話してくれるようになりました。\n\nがんばる量は、もう十分です。\nあとは、土と種と水の順番を、組み立て直すだけ。\n\nあなたの庭では、今、どこまで育っているでしょう。\n\n明日は、この5つの順番を、5回で一緒に組み立てる講座のご案内をお送りします。\n今回は、モニターとしての募集です。\n\n今日も読んでくれて、ありがとう。\n小さな芽を見つけられる一日になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日は、放課後の教室のお話でした。<\/p>\n<p>今日は、「順番」のお話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちょっと、庭で花を育てるところを思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>春に、きれいな花を咲かせたい。<\/p>\n<p>そう思ったら、まず何をするでしょう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ザクッ、ザクッと、スコップで土をほりかえす。<\/p>\n<p>ふかふかの土に、小さな種をそっとまく。<\/p>\n<p>じょうろで、シャーッと水をあげる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>しばらくすると、土の中から、小さな芽がぴょこんと顔を出す。<\/p>\n<p>葉っぱが増えて、つぼみがふくらんで・・・<\/p>\n<p>ある朝、ふわっと花がひらく。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>花は、いちばん最後なんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ところが、「口コミを増やしたい」と思ったとき、<\/p>\n<p>多くの人は、花の飾り方から探しはじめます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>紹介キャンペーン。<\/p>\n<p>お客様の声の集め方。<\/p>\n<p>SNSでシェアしてもらうお願いの仕方。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>どれも、まちがってはいないの。<\/p>\n<p>でも、土や種がまだ整っていないところに、いくら飾りつけをしても、花は咲かないんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>口コミが自然に起きている人には、その前に、こんな順番があります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1つめ。自分が、なぜこの仕事をするのかという「軸」がある。<\/p>\n<p>花でいえば、日当たりのいい場所を選ぶこと。ここがずれると、何を植えても育ちにくいの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>2つめ。お客様が申し込むまでの「流れ」を知っている。<\/p>\n<p>水やりの道すじです。どこに、いつ、どれくらい水をあげるかがわかっている。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>3つめ。「だれの、何を変えるのか」が、ひとことで言える。<\/p>\n<p>花壇に立てる名札のようなもの。通りかかった人が、「あ、ここは〇〇の花壇なんだ」とすぐにわかる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>4つめ。商品が「お客様の変化」でできている。<\/p>\n<p>これが、種そのものです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>5つめ。自分に合った「届け方」をしている。<\/p>\n<p>植える季節を選ぶこと。春に強い花もあれば、秋に咲く花もあるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この順番が整うと、お客様は「変わった」と感じます。<\/p>\n<p>そして、自分の変化を、自分の言葉で、人に話しはじめるの。<\/p>\n<p>それが、口コミという花です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>道しるべタイプの人が止まりやすいのも、4つめだと思っています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>伝えるのは、とても上手。<\/p>\n<p>でも、商品が「知識の量」でできていて、「お客様が変わる道のり」になっていないことが多いんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>知識は、受けとった瞬間に「わかった」で終わります。<\/p>\n<p>変わる道のりには、「明日から、まずこれをやる」という一歩がある。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1〜3通目でお話しした「教える量を半分に」と「明日から、まず何をしてみますか？」は、<\/p>\n<p>実は、この4つめを整えるための練習でもあったの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちょっとだけ、ご自分の商品を思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・お客様が受けたあと、何がどう変わるか、ひとことで言えますか？<\/p>\n<p>・その変化は、1回で終わりますか？　それとも、続いていきますか？<\/p>\n<p>・受けたあと、お客様が最初にやる一歩は、はっきりしていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もし、どれかで「うーん」と手が止まったなら、<\/p>\n<p>そこが、種を植え直すところなのかもしれません。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>手が止まったのは、気づけたしるし。<\/p>\n<p>気づけた人から、庭は少しずつ変わっていきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私も、最初に作った講座は、知識をぎゅうぎゅうにつめこんだ6回講座でした。<\/p>\n<p>毎回、分厚いテキストをドサッと配って、時間いっぱい説明する。<\/p>\n<p>「すごく勉強になりました」と言ってもらえる。でも、だれも動かない。<\/p>\n<p>「知識の量」を売っていたんだと、あとになって気づきました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そこで、講座を「一歩ずつ進む道のり」に作り直したんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1回目は、お客様が今どこにいるかを、一緒に確かめる。<\/p>\n<p>2回目は、行きたい場所を、お客様の言葉で決める。<\/p>\n<p>3回目からは、毎回「次の一歩」をひとつだけ選んで、次の回までにやってきてもらう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>伝えていることは、ほとんど変わらないの。<\/p>\n<p>整理して、順番を見せて、わかりやすく伝える。<\/p>\n<p>道しるべタイプの得意なことばかりです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちがったのは、お客様の帰り道の表情でした。<\/p>\n<p>「勉強になった」という顔から、<\/p>\n<p>「次までに、これをやってみよう」という顔に変わったんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そして3か月後。<\/p>\n<p>「最近ね、こんなことができるようになったの」<\/p>\n<p>と、お客様のほうから、うれしそうに話してくれるようになりました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>がんばる量は、もう十分です。<\/p>\n<p>あとは、土と種と水の順番を、組み立て直すだけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたの庭では、今、どこまで育っているでしょう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、この5つの順番を、5回で一緒に組み立てる講座のご案内をお送りします。<\/p>\n<p>今回は、モニターとしての募集です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>小さな芽を見つけられる一日になりますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1929}, {"n": 6, "day": "6日後", "subject": "【ご案内】起業５ステップ講座 モニター募集", "text": "((friendly_name))\n\n美智代です。\n今日は、昨日お約束したご案内です。\n\nその前に、ひとつだけ。\n\nはじめての場所へ車で行くとき、地図アプリを使いますよね。\n行き先を入れると、ピコンと音がして、道すじが青い線でスッと引かれる。\n\n「300メートル先、右です」\n\nあの声があるから、知らない道でも、安心して進めるの。\n\nもし、地図アプリがなかったら・・・。\n目的地はわかっているのに、どの角を曲がればいいのかわからない。\n同じ交差点を、ぐるぐる回ってしまう。\n\n起業も、少し似ていると思うんです。\n\n行きたい場所は、もうはっきりしている。\n学んできたことも、たくさんある。\n足りないのは、「次は、ここを右」という道すじだけ。\n\nその道すじを、5回で一緒に引いていくのが、この講座です。\n\n起業５ステップ講座\nすでに動いているのに、結果につながらないあなたへ。\n\nこんな方に、受けてほしいと思っています。\n・資格も学びもあるのに、紹介や申し込みにつながらない\n・お客様に喜ばれているのに、次が続かない\n・売り込むのは苦手。でも、自分の力で収入を作りたい\n・何から手をつければいいのか、順番を知りたい\n\nすでに学び、動いてきた方が、バラバラになった知識を、正しい順番に並べ直すための講座です。\n\n5回の中身\nSTEP1　起業の軸を作る\nSTEP2　ビジネスの基本と、行動を止める「マインドの壁」をほどく\nSTEP3　だれの、何を変えるのかを決める（コンセプト）\nSTEP4　お客様の変化でできた商品を作る\nSTEP5　自分に合った届け方を決める\n\n昨日お話しした、5つの順番そのままです。\n\n1回ごとに、ワークシートに書きこみながら進めます。\nカリカリとペンを走らせていくうちに、\n頭の中でもやもやしていたことが、1枚の紙の上に、すっと並んでいく。\nその感覚を、毎回味わってもらえると思います。\n\n5回を終えたとき、手元にあるもの\n・ぶれない起業の軸\n・ひとことで言えるコンセプト\n・お客様の変化を軸にした商品\n・自分に合った集客の型\n\nそして、「次に何をすればいいか」が、自分の言葉で言える状態です。\n\n内容\n・オンライン（Zoom）ライブ　全5回\n・ワークシート一式つき\n・60分の個別セッションつき\n\n参加費\n通常 66,000円 → モニター価格 33,000円（税込）\n\nモニター価格なのは、この形で講座を開くのが、今回がはじめてだからです。\nそのかわり、受講後に、正直なご感想をお聞かせください。\nいただいた声をもとに、次の講座をもっと良くしていきます。\n\n日程：【日程】\n締切：【締切日】\n定員：【定員】\n\n▼くわしく見る・申し込む\n【申込URL】\n\n道しるべタイプの方には、とくに、60分の個別セッションを大切に使ってほしいと思っています。\n\nあなたがこれまで学んできたこと。\nその中から、お客様の変化にいちばん必要なものを、一緒に選び抜きます。\n30ページの資料を、3ページにするイメージです。\n\nそして、STEP2では、行動を止めているブレーキを、脳のしくみからほどいていきます。\nマインドチューニングのやり方も、ここでお伝えします。\n\n道しるべタイプの方が、とくに変化を感じやすいのは、STEP4です。\n「知識の量」でできていた商品を、「変わる道のり」に作り直していきます。\n昨日お話しした、6回講座を作り直したときと同じ流れです。\n\nわかりやすく伝えられる方ほど、商品を作り直したとたん、\n「考えておきます」が「やってみます」に変わっていくのを感じてもらえると思います。\n\nここまで読んで、\n「ちょっと気になる。でも、今の私で大丈夫かな」\nと思った方もいると思うの。\n\n明日は、申し込む前に知っておいてほしいことを、正直にお話ししますね。\n\n個別セッションでは、画面ごしに、ゆっくりお話を聞かせてください。\nお茶を片手に、コトン、とカップを置きながら、\n「最近、どんなお客様がいらっしゃいましたか？」\nというところから、はじめましょうね。\n\n診断を受けてくださった方に、最初にお知らせしています。\n\n今日も読んでくれて、ありがとう。\n迷わず進める一日になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p>今日は、昨日お約束したご案内です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その前に、ひとつだけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>はじめての場所へ車で行くとき、地図アプリを使いますよね。<\/p>\n<p>行き先を入れると、ピコンと音がして、道すじが青い線でスッと引かれる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「300メートル先、右です」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あの声があるから、知らない道でも、安心して進めるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もし、地図アプリがなかったら・・・。<\/p>\n<p>目的地はわかっているのに、どの角を曲がればいいのかわからない。<\/p>\n<p>同じ交差点を、ぐるぐる回ってしまう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>起業も、少し似ていると思うんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>行きたい場所は、もうはっきりしている。<\/p>\n<p>学んできたことも、たくさんある。<\/p>\n<p>足りないのは、「次は、ここを右」という道すじだけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その道すじを、5回で一緒に引いていくのが、この講座です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>起業５ステップ講座<\/p>\n<p>すでに動いているのに、結果につながらないあなたへ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>こんな方に、受けてほしいと思っています。<\/p>\n<p>・資格も学びもあるのに、紹介や申し込みにつながらない<\/p>\n<p>・お客様に喜ばれているのに、次が続かない<\/p>\n<p>・売り込むのは苦手。でも、自分の力で収入を作りたい<\/p>\n<p>・何から手をつければいいのか、順番を知りたい<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>すでに学び、動いてきた方が、バラバラになった知識を、正しい順番に並べ直すための講座です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>5回の中身<\/p>\n<p>STEP1　起業の軸を作る<\/p>\n<p>STEP2　ビジネスの基本と、行動を止める「マインドの壁」をほどく<\/p>\n<p>STEP3　だれの、何を変えるのかを決める（コンセプト）<\/p>\n<p>STEP4　お客様の変化でできた商品を作る<\/p>\n<p>STEP5　自分に合った届け方を決める<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日お話しした、5つの順番そのままです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1回ごとに、ワークシートに書きこみながら進めます。<\/p>\n<p>カリカリとペンを走らせていくうちに、<\/p>\n<p>頭の中でもやもやしていたことが、1枚の紙の上に、すっと並んでいく。<\/p>\n<p>その感覚を、毎回味わってもらえると思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>5回を終えたとき、手元にあるもの<\/p>\n<p>・ぶれない起業の軸<\/p>\n<p>・ひとことで言えるコンセプト<\/p>\n<p>・お客様の変化を軸にした商品<\/p>\n<p>・自分に合った集客の型<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そして、「次に何をすればいいか」が、自分の言葉で言える状態です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>内容<\/p>\n<p>・オンライン（Zoom）ライブ　全5回<\/p>\n<p>・ワークシート一式つき<\/p>\n<p>・60分の個別セッションつき<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>参加費<\/p>\n<p>通常 66,000円 → モニター価格 33,000円（税込）<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>モニター価格なのは、この形で講座を開くのが、今回がはじめてだからです。<\/p>\n<p>そのかわり、受講後に、正直なご感想をお聞かせください。<\/p>\n<p>いただいた声をもとに、次の講座をもっと良くしていきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>日程：【日程】<\/p>\n<p>締切：【締切日】<\/p>\n<p>定員：【定員】<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>▼くわしく見る・申し込む<\/p>\n<p>【申込URL】<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>道しるべタイプの方には、とくに、60分の個別セッションを大切に使ってほしいと思っています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたがこれまで学んできたこと。<\/p>\n<p>その中から、お客様の変化にいちばん必要なものを、一緒に選び抜きます。<\/p>\n<p>30ページの資料を、3ページにするイメージです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そして、STEP2では、行動を止めているブレーキを、脳のしくみからほどいていきます。<\/p>\n<p>マインドチューニングのやり方も、ここでお伝えします。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>道しるべタイプの方が、とくに変化を感じやすいのは、STEP4です。<\/p>\n<p>「知識の量」でできていた商品を、「変わる道のり」に作り直していきます。<\/p>\n<p>昨日お話しした、6回講座を作り直したときと同じ流れです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>わかりやすく伝えられる方ほど、商品を作り直したとたん、<\/p>\n<p>「考えておきます」が「やってみます」に変わっていくのを感じてもらえると思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ここまで読んで、<\/p>\n<p>「ちょっと気になる。でも、今の私で大丈夫かな」<\/p>\n<p>と思った方もいると思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、申し込む前に知っておいてほしいことを、正直にお話ししますね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>個別セッションでは、画面ごしに、ゆっくりお話を聞かせてください。<\/p>\n<p>お茶を片手に、コトン、とカップを置きながら、<\/p>\n<p>「最近、どんなお客様がいらっしゃいましたか？」<\/p>\n<p>というところから、はじめましょうね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>診断を受けてくださった方に、最初にお知らせしています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>迷わず進める一日になりますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1788}, {"n": 7, "day": "7日後", "subject": "申し込む前に、正直にお伝えしたいこと", "text": "((friendly_name))\n\n美智代です。\n\n新しい靴を買ったときのこと、覚えていますか？\n\nお店で見たときは、すてきだなと思った。\nはいてみると、足にもぴったり。\nでも、レジに持っていく前に、もう一度だけ鏡の前に立って、\nコツ、コツ、と何歩か歩いてみる。\n\n「本当に、これでいいかな」\n\n大事なものを選ぶときほど、人は、もう一歩だけ確かめたくなるんです。\n\n講座も、同じだと思うの。\nだから今日は、申し込む前に気になりそうなことに、正直にお答えしますね。\n\nQ. もう十分学んできました。また同じ内容では？\n\nすでにある知識を、順番に並べ直す講座です。\n学んできた方ほど、「あれは、ここにつながっていたんだ」と、パズルのピースがカチッとはまる感覚があると思います。\n\nQ. また講座を受けても、行動できる気がしません。\n\nその気持ちが出てくること自体が、ブレーキのサインです。\n3通目でお話しした、あの試着室のカーテン。\nだからこの講座では、やり方と一緒に、「止まる理由」もほどいていきます。\n\nQ. 私の知識で、本当にお金をいただいていいのか不安です。\n\n道しるべタイプの方から、いちばん多くいただく声です。\n大丈夫です。\nお客様がお金を払うのは、知識の量よりも、「自分が変われる道すじ」に対してなの。\nあなたがすでに持っている知識で、その道すじは十分につくれます。\nこの講座では、それを一緒に形にしていきます。\n\nQ. 毎回参加できるか不安です。\n\n【録画・見逃し配信の有無を記入】\n\nQ. パソコンやZoomに自信がありません。\n\nZoomは、送られてきたURLを、ポチッと押すだけで入れます。\n音が出ない、画面が映らない、というときも、はじまる前に一緒に確かめますので、安心してくださいね。\n\nQ. 個別セッションは、いつ受けられますか？\n\n【実施のタイミングを記入（講座中／講座後など）】\n\nQ. 家のことや仕事で、時間がとれるか心配です。\n\n講座は全5回です。\n1回ごとのワークは、ワークシートに書きこむ形なので、すきま時間にも進められます。\n台所でお湯がわくのを待つあいだに、1行だけ書く。\nそれくらいの小さな積み重ねで、大丈夫なように作っています。\n\n実は、私も、はじめて高い講座に申し込んだとき、申し込みボタンの上で、指が止まりました。\n画面の前で、5分くらい、ずっと迷っていたと思います。\n\nあのとき背中を押してくれたのは、\n「このまま1年たったら、私はどうなっているんだろう」\nという問いでした。\n\n1年後も、同じ悩みを、同じノートに書いている自分。\nそれを想像したとき、ふっと覚悟が決まって、カチッとボタンを押したのを覚えています。\n\n新しい靴と同じで、はいてみてはじめて、\n「ああ、これでよかったんだ」とわかることもあるの。\n\nそして、正直にお伝えします。\nこの講座は、こんな方には向きません。\n\n・だれかにやってもらうことを前提にしている方\n・情報を集めるだけで、行動はしない方\n・今すぐ楽に結果が出る方法を探している方\n\nQ. 「モニター」は、何をすればいいですか？\n\n講座を受けたあとに、感想をお聞かせいただくだけです。\n「ここがわかりやすかった」「ここはもう少し聞きたかった」\nそんな正直な声が、次の講座をつくる大切な材料になります。\n\n反対に、\n自分に投資する覚悟があって、\n自分の力で収入を作りたいと思っている方には、\n5回で、見える景色が変わる講座です。\n\nあなたが1年後、どんな顔でお客様を見送っていたいか。\n一度だけ、思い浮かべてみてね。\n\n「勉強になりました」と言うお客様に、\n「では、明日はまずこれをやってみましょうか」と、自然に返せている自分。\nお客様から「やってみたら、できました」と報告が届くのが、うれしくてたまらない自分。\n\nその姿が少しでも浮かんだなら、きっと、もう準備はできていると思うの。\n\nもちろん、迷う気持ちがあって当然です。\n大事なお金と、大事な時間を使うことですから。\nだからこそ、納得して選んでほしいと思っています。\n\n締切は【締切日】です。\n\n▼くわしく見る・申し込む\n【申込URL】\n\n今日も読んでくれて、ありがとう。\n足どりの軽い一日になりますように(^^)\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>新しい靴を買ったときのこと、覚えていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>お店で見たときは、すてきだなと思った。<\/p>\n<p>はいてみると、足にもぴったり。<\/p>\n<p>でも、レジに持っていく前に、もう一度だけ鏡の前に立って、<\/p>\n<p>コツ、コツ、と何歩か歩いてみる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「本当に、これでいいかな」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>大事なものを選ぶときほど、人は、もう一歩だけ確かめたくなるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>講座も、同じだと思うの。<\/p>\n<p>だから今日は、申し込む前に気になりそうなことに、正直にお答えしますね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>Q. もう十分学んできました。また同じ内容では？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>すでにある知識を、順番に並べ直す講座です。<\/p>\n<p>学んできた方ほど、「あれは、ここにつながっていたんだ」と、パズルのピースがカチッとはまる感覚があると思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>Q. また講座を受けても、行動できる気がしません。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その気持ちが出てくること自体が、ブレーキのサインです。<\/p>\n<p>3通目でお話しした、あの試着室のカーテン。<\/p>\n<p>だからこの講座では、やり方と一緒に、「止まる理由」もほどいていきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>Q. 私の知識で、本当にお金をいただいていいのか不安です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>道しるべタイプの方から、いちばん多くいただく声です。<\/p>\n<p>大丈夫です。<\/p>\n<p>お客様がお金を払うのは、知識の量よりも、「自分が変われる道すじ」に対してなの。<\/p>\n<p>あなたがすでに持っている知識で、その道すじは十分につくれます。<\/p>\n<p>この講座では、それを一緒に形にしていきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>Q. 毎回参加できるか不安です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>【録画・見逃し配信の有無を記入】<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>Q. パソコンやZoomに自信がありません。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>Zoomは、送られてきたURLを、ポチッと押すだけで入れます。<\/p>\n<p>音が出ない、画面が映らない、というときも、はじまる前に一緒に確かめますので、安心してくださいね。<\/p>\n<p><br /><\/p>\n<p><br /><\/ ><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1810}, {"n": 8, "day": "締切の前日", "subject": "明日で、締め切ります", "text": "((friendly_name))\n\n美智代です。\n\n夜、ふとんに入ってから、スマホを手に取る。\n講座のページを開いて、パタン、と閉じる。\nまた開いて、スクロールして、パタン。\n\n部屋の中には、時計のカチ、カチ、という音だけ。\n\nもしかしたら、そんな夜をすごしている方もいるかもしれませんね。\n\nその迷いも、3通目でお話ししたブレーキかもしれません。\n新しいことをはじめるとき、脳は「本当に大丈夫？」と、そっと引きとめてくれるの。\n\nそんなときは、目を閉じて、すーっと息を吸って、はーっとはいてみてね。\nそれから、心の中で聞いてみる。\n\n「ブレーキがなかったら、私はどうしたい？」\n\n出てきた答えが、あなたの本当の気持ちだと思います。\n\n起業５ステップ講座のモニター募集は、\n明日【締切日】で締め切ります。\n\n今日は、これまでのメールを、少しだけふり返らせてください。\n\n診断を受けた日のこと、覚えていますか？\n8つの質問に、ポチ、ポチと答えていって、\n最後のボタンを押したあと、結果のメールが届くまで、少しどきどきしたと思うの。\n\n診断を受けたとき、知りたかったのは\n「なぜ、口コミが広がらないのか」\nだったと思います。\n\n結果は、道しるべタイプでした。\n\nペンがカリカリと走る音。\nお客様が、うなずきながらメモをとって、\n「すごく勉強になりました」と帰っていく。\nその言葉は、本物です。\nあなたが長い時間をかけて育ててきた、伝える力の証です。\n\nただ、わかった人は、安心して「自分でやってみます」と帰ってしまう。\n人に話したくなるのは、「私、変わったの」と言えるときでした。\n\nそのために必要だったのは、\n教える量を半分にして、お客様に話してもらう時間と、\nセッションの終わりの3つの質問。\n\nそして、「もっと学んでから」と、試着室から出られなくなる、脳のブレーキ。\n\nブレーキは、あなたを守ってきた味方でした。\nだから、責めずに、そっとゆるめればいい。\n\nその先に、口コミという花が咲くための、5つの順番がありました。\n\n少しだけ、3か月後を想像してみてね。\n\nいつものように、セッションの最後に聞く。\n「明日から、まず何をしてみますか？」\n\nお客様が、少し考えてから、ひとつだけ答える。\nその言葉を、ノートにそのまま書きとめる。\n\n次に会ったとき、\n「前回の一歩、どうでしたか？」\nと聞くと、お客様は、うれしそうに話しはじめる。\n「やってみたら、できたんです」\n\nそして、ある日の夜。\nスマホが、ピロン、と鳴る。\n「先生、友だちが会ってみたいって言っているんですけど、紹介してもいいですか？」\n\n口コミって、こんなふうに、静かにやってくるんだと思うの。\n\n・・・ここまで読んでくださったなら、もう、答えはわかっていると思うの。\n\nあなたの腕も、がんばりも、もう十分。\n順番がまだ整っていなくて、止まる理由がほどけていないだけ。\n\nわかったうえで、どうするか。\nそれを決めるのは、あなたです。\n\n半年後も、同じところで足ぶみしていたいか。\nそれとも、お客様が自分の言葉で、あなたのことを話してくれる毎日にしたいか。\n\nどちらを選んでも、私は応援しています。\n\nもし、迷いがあるなら、その迷いもそのまま持ってきてくださいね。\n「申し込もうか迷っているんですけど」\nという一言から、はじまるご縁もたくさんあります。\n\n気になることがあれば、このメールに返信して聞いてくださっても大丈夫です。\nひとつずつ、お答えします。\n\n▼くわしく見る・申し込む\n【申込URL】\n\n今日も読んでくれて、ありがとう。\nぐっすり眠れる夜になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>夜、ふとんに入ってから、スマホを手に取る。<\/p>\n<p>講座のページを開いて、パタン、と閉じる 変わりはじめたのは、学んだことを「順番に並べて、使いはじめた」ときでした。\n\n本棚から、たくさんのノートをバサッと出して、\n机いっぱいに広げて、ひとつずつ並べ直していったんです。\n\n「これは、軸の話」\n「これは、商品の話」\n「これは、届け方の話」\n\nそうやって並べてみると、\nばらばらだと思っていた学びが、ちゃんと1本の道につながっていたの。\nあのときの、胸のすっとする感じは、今でも忘れられません。\n\nあなたには、もう十分な知識があります。\nこみ入ったことを整理して、わかりやすく伝える力もあります。\n必要なのは、それを並べ直す時間だけ。\n\n5回で、一緒に組み立てましょう。\n\n1回目の講座の日、画面の向こうで、\n「はじめまして」と、ちょっと緊張した顔で手をふってくれるあなたに会えたら、\nとてもうれしいです。\n\n▼くわしく見る・申し込む（今夜【締切時刻】まで）\n【申込URL】\n\n締切の時刻をすぎると、申し込みのページは閉じてしまいます。\n「聞いてから決めたい」ということがあれば、このメールに返信してくださいね。\n今夜のうちに、お返事します。\n\nそして、9日間、メールを読んでくださって、本当にありがとうございました。\n\n診断の結果から、毎日少しずつお話ししてきました。\nどこかで、「これ、私のことだ」と思える一文があったなら、とてもうれしいです。\n\nステップメールは、今日でおしまいです。\n明日からは、ふだんのメルマガ【メルマガの名前】でお会いしましょう。\n口コミのこと、心の整え方のこと、日々の気づきを、気ままにお届けしています。\n\nドラマを見て考えたことや、セッションでうまれた小さな気づき、\nときどき、私のうっかり話も・・・(;'∀')\n肩の力をぬいて、お茶でも飲みながら読んでもらえたらうれしいです。\n\n今回は、ご縁がなかった方も、どうか気にしないでくださいね。\nこの9日間で受けとったことを、明日のセッションで、ひとつだけ試してもらえたら、それで十分です。\n\n「明日から、まず何をしてみますか？」\n\nこの一言から、きっと何かが動きはじめます。\n\nあなたのお客様が、いつか、\n「あの人に会って、私、変わったの」\nと、だれかに話してくれる日が来ますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>起業５ステップ講座のモニター募集は、<\/p>\n<p>今夜【締切時刻】で締め切ります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私が、はじめて自分の講座を開いた日のこと。<\/p>\n<p>パソコンの前で、募集ページの公開ボタンを、カチッと押した瞬間、<\/p>\n<p>心臓がドクドクして、思わず両手で顔をおおいました(;'∀')<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>こわかった。でも、押してよかった。<\/p>\n<p>あの一歩がなかったら、今、こうしてメールを書いている私はいないと思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日は、そんなことを思い出しながら書いています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>バス停で、乗ろうか迷っているうちに、<\/p>\n<p>目の前のバスが、プシューッと扉を閉めて走っていった。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そんな経験、ありませんか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ブォーンという音が遠ざかっていくのを見ながら、<\/p>\n<p>「あ、乗ればよかった」<\/p>\n<p>と思う。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>次のバスは、また来ます。<\/p>\n<p>でも、あのバスに乗っていたら着いていた時間には、もう着けないんですよね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>講座も、また開くことがあると思います。<\/p>\n<p>でも、今回のモニター価格と、診断を受けてくださった方への最初のご案内は、今夜までです。<\/p>\n<p><br /><\/p>\n<p た小さな気づき、<\/p>\n<p>ときどき、私のうっかり話も・・・(;'∀')<\/p>\n<p>肩の力をぬいて、お茶でも飲みながら読んでもらえたらうれしいです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今回は、ご縁がなかった方も、どうか気にしないでくださいね。<\/p>\n<p>この9日間で受けとったことを、明日のセッションで、ひとつだけ試してもらえたら、それで十分です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「明日から、まず何をしてみますか？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この一言から、きっと何かが動きはじめます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたのお客様が、いつか、<\/p>\n<p>「あの人に会って、私、変わったの」<\/p>\n<p>と、だれかに話してくれる日が来ますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1734}]}, "yorisoi": {"name": "寄り添いタイプ", "mails": [{"n": 1, "day": "登録の翌日", "subject": "「3か月後、どうなっていたら最高ですか？」と聞けましたか", "text": "((friendly_name))\n\n美智代です。\n昨日は、口コミタイプ診断を受けてくれて、ありがとうございました。\n\n結果メールの最後に、ひとつだけお願いをしたの、覚えていますか？\n\nセッションの終わりに、\n「3か月後、どうなっていたら最高ですか？」\nと聞いてみてね、というお願いです。\n\n・・・聞けましたか？\n\nもし、まだなら、それで大丈夫。\n読んだ瞬間に、胸のどこかがきゅっとした人もいると思うんです。\n\n「それって、次の申し込みをうながしているみたいで、いやらしくないかな」\n「せっかく楽になったのに、未来の話なんて重たくないかな」\n\n寄り添いタイプの人ほど、そう感じるの。\n相手の「今」の気持ちを、いちばん大事にしてきた人だから。\n\n実は、私もそうでした。\n\n教員をしていたころ、進路の面談がとても苦手だったんです。\n\n放課後の相談室。\n窓の外から、カキーン、と野球部の打球の音が聞こえてくる。\n\n目の前の生徒が、やっと本音を話してくれた。\nその空気をこわしたくなくて、\n「じゃあ、また何かあったら来てね」\nで終わらせてしまう。\n\n生徒は、すっきりした顔で、ガラガラッと戸をあけて帰っていく。\n私も、いい面談だったなと思う。\n\nでも、何週間たっても、その子の毎日は、何も変わっていなかったんです。\n\nそのころ、同じ学年に、面談の最後に必ずこう聞く先輩の先生がいました。\n\n「で、卒業する時、どんな顔で笑っていたい？」\n\n聞かれた生徒は、少し考えてから、ぽつりぽつりと話しはじめるの。\n\n「志望校に受かって、お母さんにありがとうって言いたい」\n「部活の後輩に、先輩みたいになりたいって言われたい」\n\nそして、その子たちは、いつのまにか自分で動きはじめていました。\n\n・・・あのころの私は、「聞く」ところで止まっていたんだと思う。\n\nたとえば、美容院を思い浮かべてみてね。\n\nシャキ、シャキ、とハサミの音。\nドライヤーのあたたかい風。\n\n「今日はどうしますか？」とだけ聞いて、ていねいに切ってくれる美容師さん。\nもうひとりは、\n「次の春、どんな髪で過ごしたいですか？」\nと聞いてくれる美容師さん。\n\nどちらも、腕はいいんです。\nでも、また行きたくなるのは、たぶん後のほう。\n友だちに「あそこ、いいよ」と話したくなるのも、きっと後のほうだと思うの。\n\nなぜなら、その美容師さんと話している間に、自分の「春」が見えたから。\n人は、自分の口で言った未来を、ちゃんと覚えているんです。\n\nそして、その未来に近づいたとき、\n「あの日、あの人に聞かれてね」\nと、だれかに話したくなる。\n\n口コミの種は、この一言の中にあると思っています。\n\n「3か月後、どうなっていたら最高ですか？」\n\nちなみに、どうして「3か月後」なのか。\n\n1年後だと、遠すぎて、ぼんやりしてしまうの。\n来週だと、近すぎて、今の悩みの続きになってしまう。\n\n3か月は、季節がひとつ変わるくらいの長さです。\n夏の終わりに聞かれたら、落ち葉をカサカサふんで歩く、秋の終わりの自分。\nどんな服を着て、どんな朝を迎えているか、からだで想像できる長さなんです。\n\nこの質問には、売り込みも、提案も入っていません。\n聞いているのは、お客様の「これから」だけ。\n\nだから、やさしい人ほど、上手に聞けるの。\n相手の気持ちを大事にしてきた人の声で聞かれると、お客様は安心して、未来を話してくれます。\n\nそれでも、いきなり聞くのはちょっと勇気がいる・・・という人へ。\n\n前に、ひとことだけ添えてみてね。\n\n「最後に、ひとつだけ聞いてもいいですか？」\n\nこのひとことがあるだけで、お客様の心にも、聞く側の心にも、小さな準備ができるの。\n\nたとえば、こんなふうに返ってくることがあります。\n\n「3か月後・・・。朝、目覚ましがピピピッと鳴ったときに、はぁ・・・ってため息をつかない自分でいたいです」\n\nこの答えが返ってきたら、もう十分。\nうまく返そうとしなくていいんです。\n\n「すてきですね。ため息をつかない朝」\n\nそう言って、うなずくだけ。\nできれば、カルテやノートに、お客様の言葉のまま書きとめておいてね。\n\n次に会ったとき、\n「前回、ため息をつかない朝って話してくれましたよね」\nと伝えると、お客様はびっくりして、少しうれしそうな顔をします。\n\n自分の言った未来を、だれかが覚えていてくれた。\nそれだけで、人は「この人に話してよかった」と感じるの。\n\nあなたのお客様は、3か月後、どんな顔で笑っていたいと思っているでしょう。\n\n次のセッションで、ぜひ一度、聞いてみてね。\nお客様の目が、ふっと遠くを見る瞬間があるはずです(^^)\n\n明日は、その答えを聞いたあと、どうつなげていくかをお話しします。\n\n今日も読んでくれて、ありがとう。\nやさしい一日になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p>昨日は、口コミタイプ診断を受けてくれて、ありがとうございました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>結果メールの最後に、ひとつだけお願いをしたの、覚えていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>セッションの終わりに、<\/p>\n<p>「3か月後、どうなっていたら最高ですか？」<\/p>\n<p>と聞いてみてね、というお願いです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・・・聞けましたか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もし、まだなら、それで大丈夫。<\/p>\n<p>読んだ瞬間に、胸のどこかがきゅっとした人もいると思うんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「それって、次の申し込みをうながしているみたいで、いやらしくないかな」<\/p>\n<p>「せっかく楽になったのに、未来の話なんて重たくないかな」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>寄り添いタイプの人ほど、そう感じるの。<\/p>\n<p>相手の「今」の気持ちを、いちばん大事にしてきた人だから。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>実は、私もそうでした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>教員をしていたころ、進路の面談がとても苦手だったんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>放課後の相談室。<\/p>\n<p>窓の外から、カキーン、と野球部の打球の音が聞こえてくる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>目の前の生徒が、やっと本音を話してくれた。<\/p>\n<p>その空気をこわしたくなくて、<\/p>\n<p>「じゃあ、また何かあったら来てね」<\/p>\n<p>で終わらせてしまう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>生徒は、すっきりした顔で、ガラガラッと戸をあけて帰っていく。<\/p>\n<p>私も、いい面談だったなと思う。<\/p>\n<p><br /><\/p>\n<p><br /> ？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>このひとことがあるだけで、お客様の心にも、聞く側の心にも、小さな準備ができるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>たとえば、こんなふうに返ってくることがあります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「3か月後・・・。朝、目覚ましがピピピッと鳴ったときに、はぁ・・・ってため息をつかない自分でいたいです」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この答えが返ってきたら、もう十分。<\/p>\n<p>うまく返そうとしなくていいんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「すてきですね。ため息をつかない朝」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そう言って、うなずくだけ。<\/p>\n<p>できれば、カルテやノートに、お客様の言葉のまま書きとめておいてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>次に会ったとき、<\/p>\n<p>「前回、ため息をつかない朝って話してくれましたよね」<\/p>\n<p>と伝えると、お客様はびっくりして、少しうれしそうな顔をします。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>自分の言った未来を、だれかが覚えていてくれた。<\/p>\n<p>それだけで、人は「この人に話してよかった」と感じるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたのお客様は、3か月後、どんな顔で笑っていたいと思っているでしょう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>次のセッションで、ぜひ一度、聞いてみてね。<\/p>\n<p>お客様の目が、ふっと遠くを見る瞬間があるはずです(^^)<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、その答えを聞いたあと、どうつなげていくかをお話しします。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>やさしい一日になりますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 2041}, {"n": 2, "day": "2日後", "subject": "「楽になった」を「変わった」に変える、セッションの終わり方", "text": "((friendly_name))\n\n美智代です。\n\n昨日の「3か月後、どうなっていたら最高ですか？」は、聞けそうですか？\n\n今日は、その続きのお話です。\n\nちょっと、料理教室を思い浮かべてみてね。\n\nハンバーグの作り方を習う、2時間のレッスン。\nボウルの中で、ぺたぺた、ぎゅっぎゅっとひき肉をこねる。\nフライパンにのせると、ジュワーッといい音がして、\nキッチンいっぱいに、香ばしいにおいが広がる。\n\nみんなで「いただきます」をして、\n「おいしいね」と笑い合う。\n\nレッスンの終わり。\n先生が、こう言って見送ります。\n\n「今日もおつかれさまでした。おいしくできましたね」\n\nあたたかい終わり方です。\n生徒さんも、満足して帰っていく。\n\nでも、もうひとりの先生は、最後にこう聞くの。\n\n「今日のハンバーグ、おうちでだれに作ってあげたいですか？」\n\n生徒さんは、ちょっと考えて答えます。\n「週末、娘に作ってあげたいな。前に、お店の味がいいって言われちゃって」\n\n帰り道、この生徒さんの頭の中は、もう\n「娘、なんて言うかな」\nでいっぱいなんです。\n\nそして週末、娘さんが「おいしい」と言ったとき。\nこの生徒さんは、きっとだれかに話します。\n「料理教室で習ったの。あそこ、いいよ」って。\n\n・・・セッションも、まったく同じだと思うの。\n\n実は、私も最初のころ、終わり方がうまくできていませんでした。\n\nお客様が大切な気づきをくれたとき、\n「今日は、〇〇に気づけましたね」\nと、私がきれいにまとめてしまっていたんです。\n\nお客様はうなずいてくれる。\nでも、まとめたのは私の言葉。\nお客様は、自分の口ではまだ何も言っていなかったんです。\n\nだから、家に帰るころには、その気づきが少しずつ薄れてしまっていたんだと思います。\n\nそれからは、終わる5分前に、3つのことだけをするようにしました。\n\n1つめ。今日、何が変わったかを、お客様に言ってもらう。\n「今日、来たときと比べて、何か変わったことはありますか？」\n\n2つめ。その言葉を、そのまま返す。\n「『自分を責めなくていいんだ』と思えたんですね」\n\n3つめ。その先を、一緒に見る。\n「その気持ちのまま3か月過ごせたら、どうなっていそうですか？」\n\nむずかしいことは、何もないの。\n寄り添いタイプの人は、もともと聞くのが上手だから、きっとすぐにできるようになります。\n\n実際のセッションだと、こんな感じです。\n\n40代のお客様。\n仕事と親の介護で、毎日いっぱいいっぱいだった方です。\n\n「今日、来たときと比べて、何か変わったことはありますか？」\n\n「・・・そうですね。全部ひとりでやらなきゃって、思いこんでいた気がします」\n\n「全部ひとりでやらなきゃって、思いこんでいたんですね」\n\n「はい。弟にも、少し頼んでみようかなって」\n\n「弟さんに頼めたら、3か月後、どうなっていそうですか？」\n\n「週に1回くらいは、自分のために、ゆっくりお茶を飲む時間がとれるかも」\n\nそう言いながら、目の前のカップを両手でつつんで、ふぅっと息をはく。\nその顔が、来たときとはまるでちがって見えたんです。\n\nこの方が帰り道に思い出すのは、セッションの内容よりも、\n「週に1回、自分のためのお茶」\nなんです。\n\n3つの質問をはじめたころ、私がいちばんこわかったのは「沈黙」でした。\n\n質問をしたあと、お客様が黙りこむ。\n部屋の中に、時計のカチ、カチ、という音だけがひびく。\n5秒、10秒・・・。\n\nその間がたえられなくて、つい\n「たとえば、気持ちが軽くなったとか？」\nと、答えを先に言ってしまっていたんです(;'∀')\n\nでも、あの沈黙は、お客様が自分の中の言葉をさがしている時間なの。\nそこで待てるかどうかで、出てくる言葉の深さがまったく変わります。\n\n今は、心の中でゆっくり10数えるようにしています。\nたいてい、7つくらいで、お客様が話しはじめてくれるの。\n\nもし、お客様がうまく言葉にできないときは、\n「小さなことでも大丈夫ですよ」\nと、ひとこと添えてみてね。\n\n「肩が少し軽い」でも、「なんだか眠くなってきた」でもいいの。\nからだの小さな変化も、立派な変化です。\n\nこの3つで、お客様は「楽になった人」から「変わりはじめた人」になります。\nそして、自分の変化を、自分の言葉で持ち帰ってくれる。\n\n自分の言葉で持ち帰った変化は、人に話せるんです。\n\n「最近ね、自分を責めるのをやめたの」\n\nその話のついでに、名前が出てくる。\n口コミって、こんなふうに静かに始まるんだと思っています。\n\nあなたのセッションは、いつも、どんな言葉で終わっていますか？\n\n・・・ただ、ここまで読んで、\n「頭ではわかる。でも、いざとなると言えない気がする」\nと感じた人もいると思うの。\n\n明日は、その「言えない」の正体をお話ししますね。\n\n今日も読んでくれて、ありがとう。\nあたたかい一日になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日の「3か月後、どうなっていたら最高ですか？」は、聞けそうですか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日は、その続きのお話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちょっと、料理教室を思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ハンバーグの作り方を習う、2時間のレッスン。<\/p>\n<p>ボウルの中で、ぺたぺた、ぎゅっぎゅっとひき肉をこねる。<\/p>\n<p>フライパンにのせると、ジュワーッといい音がして、<\/p>\n<p>キッチンいっぱいに、香ばしいにおいが広がる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>みんなで「いただきます」をして、<\/p>\n<p>「おいしいね」と笑い合う。<\/p /><\/p>\n<p><br /><\/p>\n<p>「はい。弟にも、少し頼んでみようかなって」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「弟さんに頼めたら、3か月後、どうなっていそうですか？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「週に1回くらいは、自分のために、ゆっくりお茶を飲む時間がとれるかも」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そう言いながら、目の前のカップを両手でつつんで、ふぅっと息をはく。<\/p>\n<p>その顔が、来たときとはまるでちがって見えたんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この方が帰り道に思い出すのは、セッションの内容よりも、<\/p>\n<p>「週に1回、自分のためのお茶」<\/p>\n<p>なんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>3つの質問をはじめたころ、私がいちばんこわかったのは「沈黙」でした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>質問をしたあと、お客様が黙りこむ。<\/p>\n<p>部屋の中に、時計のカチ、カチ、という音だけがひびく。<\/p>\n<p>5秒、10秒・・・。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その間がたえられなくて、つい<\/p>\n<p>「たとえば、気持ちが軽くなったとか？」<\/p>\n<p>と、答えを先に言ってしまっていたんです(;'∀')<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>でも、あの沈黙は、お客様が自分の中の言葉をさがしている時間なの。<\/p>\n<p>そこで待てるかどうかで、出てくる言葉の深さがまったく変わります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今は、心の中でゆっくり10数えるようにしています。<\/p>\n<p>たいてい、7つくらいで、お客様が話しはじめてくれるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もし、お客様がうまく言葉にできないときは、<\/p>\n<p>「小さなことでも大丈夫ですよ」<\/p>\n<p>と、ひとこと添えてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「肩が少し軽い」でも、「なんだか眠くなってきた」でもいいの。<\/p>\n<p>からだの小さな変化も、立派な変化です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この3つで、お客様は「楽になった人」から「変わりはじめた人」になります。<\/p>\n<p>そして、自分の変化を、自分の言葉で持ち帰ってくれる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>自分の言葉で持ち帰った変化は、人に話せるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「最近ね、自分を責めるのをやめたの」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その話のついでに、名前が出てくる。<\/p>\n<p>口コミって、こんなふうに静かに始まるんだと思っています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたのセッションは、いつも、どんな言葉で終わっていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・・・ただ、ここまで読んで、<\/p>\n<p>「頭ではわかる。でも、いざとなると言えない気がする」<\/p>\n<p>と感じた人もいると思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、その「言えない」の正体をお話ししますね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>あたたかい一日になりますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 2087}, {"n": 3, "day": "3日後", "subject": "言いかけて、飲みこんだ一言", "text": "((friendly_name))\n\n美智代です。\n\n車を運転する方なら、こんな経験はありませんか？\n\nアクセルをふんでいるのに、なんだか車が重たい。\nブォーン、ブォーンと、エンジンの音ばかり大きくて、前に進まない。\n\nふと見ると、サイドブレーキが引いたままだった・・・(;'∀')\nあわてて、カチッと戻す。\n\n今日は、そんなお話です。\n\n「次は、こんなふうに進めていきませんか」\n\n言おうと思っていた。\n準備もしていた。\n\nでも、お客様の安心した顔を見た瞬間、\nその言葉を、そっと飲みこむ。\n\n「今日は、いいか」\n「せっかく楽になったのに、水をさしたくない」\n\nお客様を見送ったあと、\n片づけをしながら、少しだけ自分を責める。\n\nそんな日が、何度もあったと思うんです。\n\n私にも、ありました。\n\n起業したばかりのころ、自分の講座の案内が、なかなか言えなかったの。\n\nお茶会で、とても楽しくお話ができた。\nカチャカチャとカップの音、あちこちで、あははっと笑い声。\nみなさん「来てよかった」と言ってくれた。\n\n最後に、講座のことを少しだけ話そうと決めていたのに、\n口から出てきたのは、\n「また、お茶会しましょうね」\nだけでした。\n\n帰りの車の中。\nワイパーが、キュッ、キュッと雨をはらう音を聞きながら、\n「なんで言えなかったんだろう」\nと、はぁっとため息をついたのを覚えています。\n\nあとになって、脳のしくみを学んだとき、やっとわかったんです。\n\n脳は、「嫌われるかもしれない」場面を、危ないと感じるようにできているの。\nそして、いちばん大事な場面で、ブレーキをかけます。\n\n人を大切にしてきた人ほど、このブレーキは強くなります。\n相手との関係をこわさないように、守ってくれているんです。\n\nだから、昨日の3つの質問も、ノウハウとしては簡単なのに、\nいざとなると、口が重くなる。\n\nアクセルをふみながら、サイドブレーキも引いている状態。\nいくら学んでも、エンジンの音ばかり大きくなって、前に進まないんです。\n\nこのブレーキは、からだにも出てきます。\n\n言おうとした瞬間に、のどがきゅっとする。\n心臓が、ドキドキッと速くなる。\n急に、ちがう話題をふってしまう。\nあはは、と笑ってごまかして、ちらっと時計を見る。\n\n思い当たるもの、ありましたか？\n\nこれは、性格よりももっと奥の、脳の中で起きていることなの。\n脳が、あなたを守ろうとして、反射的に動いているだけなんです。\n\nだから、「次こそ言うぞ」と気合いを入れるほど、ブレーキも強くなってしまう。\nがんばり屋さんほど、ここで苦しくなります。\n\nここで、ひとつ大事なことがあります。\n\nブレーキは、味方なの。\n今まで、あなたと、あなたの大切な人間関係を守ってきてくれたもの。\n\nだから、自分を責めなくていいんです。\n必要なのは、ブレーキを外すことより、そっとゆるめること。\n\n私は、脳科学の認定を受けて、このしくみを教えています。\nそして、このブレーキをゆるめる方法を「マインドチューニング」と呼んでいます。\n\n楽器の調律のように、少しずつ音を合わせていくイメージです。\n\nピアノは、毎日弾いていても、少しずつ音がずれていくの。\nずれたまま弾き続けると、どんなに上手な人の演奏でも、どこか落ち着かない音になる。\n\nでも、調律師さんが、ポーン、ポーンと1本ずつ弦を合わせていくと、\n同じピアノとは思えないくらい、やわらかい音が鳴りはじめます。\n\n心も、同じだと思うの。\n\nブレーキがゆるむと、あの一言は、びっくりするくらい自然に出てくるようになります。\n相手を大切に思う気持ちは、そのままで。\n大切に思うからこそ、「この先」を一緒に見られるようになるの。\n\n今日、ひとつだけ、小さな練習をしてみませんか。\n\n最近、言いかけて飲みこんだ一言を、紙に書いてみるの。\n「次は、こんなふうに進めていきませんか」でも、\n「この講座、きっと合うと思います」でも大丈夫。\n\n書けたら、ひとりのときに、声に出して読んでみてね。\n\nたぶん、のどが少しきゅっとすると思います。\nそれが、ブレーキの感覚です。\n\n「ああ、今、守ろうとしてくれているんだな」\nと、心の中で言ってあげてください。\n\nそれだけで、ブレーキは少しだけゆるみます。\n責めるかわりに、気づいてあげる。\nそこが、はじまりなんです。\n\nあなたが最近、言いかけて飲みこんだ一言は、どんな言葉でしたか？\n\nその一言は、きっと、お客様が待っている言葉だと思います。\n\n明日は、少しだけ私の話をさせてください。\n教員として、1万人以上の生徒さんと向き合う中で見てきた、ある光景の話です。\n\n今日も読んでくれて、ありがとう。\n心がふっとほどける一日になりますように(^^)\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>車を運転する方なら、こんな経験はありませんか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>アクセルをふんでいるのに、なんだか車が重たい。<\/p>\n<p>ブォーン、ブォーンと、エンジンの音ばかり大きくて、前に進まない。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ふと見ると、サイドブレーキが引いたままだった・・・(;'∀')<\/p>\n<p>あわてて、カチッと戻す。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日は、そんなお話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「次は、こんなふうに進めていきませんか」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>言おうと思っていた。<\/p>\n<p>準備もしていた。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>でも、お客様の安心した顔を見た瞬間、<\/p>\n<p>その言葉を、そっと飲みこむ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「今日は、いいか」<\/p>\n<p>「せっかく楽になったのに、水をさしたくない」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>お客様を見送ったあと、<\/p>\n<p>片づけをしながら、少しだけ自分を責める。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そんな日が、何度もあったと思うんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私にも、ありました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>起業したばかりのころ、自分の講座の案内が、なかなか言えなかったの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>お茶会で、とても楽しくお話ができた。<\/p>\n<p>カチャカチャとカップの音、あちこちで、あははっと笑い声。<\/p>\n<p>みなさん「来てよかった」と言ってくれた。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>最後に、講座のことを少しだけ話そうと決めていたのに、<\/p>\n<p>口から出てきたのは、<\/p>\n<p>「また、お茶会しましょうね」<\/p>\n<p>だけでした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>帰りの車の中。<\/p>\n<p>ワイパーが、キュッ、キュッと雨をはらう音を聞きながら、<\/p>\n<p>「なんで言えなかったんだろう」<\/p>\n<p>と、はぁっとため息をついたのを覚えています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あとになって、脳のしくみを学んだとき、やっとわかったんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>脳は、「嫌われるかもしれない」場面を、危ないと感じるようにできているの。<\/p>\n<p>そして、いちばん大事な場面で、ブレーキをかけます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>人を大切にしてきた人ほど、このブレーキは強くなります。<\/p>\n<p>相手との関係をこわさないように、守ってくれているんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>だから、昨日の3つの質問も、ノウハウとしては簡単なのに、<\/p>\n<p>いざとなると、口が重くなる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>アクセルをふみながら、サイドブレーキも引いている状態。<\/p>\n<p>いくら学んでも、エンジンの音ばかり大きくなって、前に進まないんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>このブレーキは、からだにも出てきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>言おうとした瞬間に、のどがきゅっとする。<\/p>\n<p>心臓が、ドキドキッと速くなる。<\/p>\n<p>急に、ちがう話題をふってしまう。<\/p>\n<p>あはは、と笑ってごまかして、ちらっと時計を見る。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>思い当たるもの、ありましたか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>これは、性格よりももっと奥の、脳の中で起きていることなの。<\/p>\n<p>脳が、あなたを守ろうとして、反射的に動いているだけなんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>だから、「次こそ言うぞ」と気合いを入れるほど、ブレーキも強くなってしまう。<\/p>\n<p>がんばり屋さんほど、ここで苦しくなります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ここで、ひとつ大事なことがあります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ブレーキは、味方なの。<\/p>\n<p>今まで、あなたと、あなたの大切な人間関係を守ってきてくれたもの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>だから、自分を責めなくていいんです。<\/p>\n<p>必要なのは、ブレーキを外すことより、そっとゆるめること。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私は、脳科学の認定を受けて、このしくみを教えています。<\/p>\n<p>そして、このブレーキをゆるめる方法を「マインドチューニング」と呼んでいます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>楽器の調律のように、少しずつ音を合わせていくイメージです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ピアノは、毎日弾いていても、少しずつ音がずれていくの。<\/p>\n<p>ずれたまま弾き続けると、どんなに上手な人の演奏でも、どこか落ち着かない音になる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>でも、調律師さんが、ポーン、ポーンと1本ずつ弦を合わせていくと、<\/p>\n<p>同じピアノとは思えないくらい、やわらかい音が鳴りはじめます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>心も、同じだと思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ブレーキがゆるむと、あの一言は、びっくりするくらい自然に出てくるようになります。<\/p>\n<p>相手を大切に思う気持ちは、そのままで。<\/p>\n<p>大切に思うからこそ、「この先」を一緒に見られるようになるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日、ひとつだけ、小さな練習をしてみませんか。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>最近、言いかけて飲みこんだ一言を、紙に書いてみるの。<\/p>\n<p>「次は、こんなふうに進めていきませんか」でも、<\/p>\n<p>「この講座、きっと合うと思います」でも大丈夫。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>書けたら、ひとりのときに、声に出して読んでみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>たぶん、のどが少しきゅっとすると思います。<\/p>\n<p>それが、ブレーキの感覚です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「ああ、今、守ろうとしてくれているんだな」<\/p>\n<p>と、心の中で言ってあげてください。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>それだけで、ブレーキは少しだけゆるみます。<\/p>\n<p>責めるかわりに、気づいてあげる。<\/p>\n<p>そこが、はじまりなんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたが最近、言いかけて飲みこんだ一言は、どんな言葉でしたか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その一言は、きっと、お客様が待っている言葉だと思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、少しだけ私の話をさせてください。<\/p>\n<p>教員として、1万人以上の生徒さんと向き合う中で見てきた、ある光景の話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>心がふっとほどける一日になりますように(^^)<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 2011}, {"n": 4, "day": "4日後", "subject": "放課後の教室で、何度も見てきた光景", "text": "((friendly_name))\n\n美智代です。\n\n昨日は、「言いかけて、飲みこんだ一言」のお話をしました。\n今日は約束どおり、少しだけ私の話をさせてくださいね。\n\n私は、20年以上、教員をしていました。\n個別指導の塾も経営してきて、向き合ってきた生徒さんは、1万人を超えます。\n\nその中で、何度も見てきた光景があるんです。\n\nテストの時間。\nキーンコーンカーンコーン、とチャイムが鳴って、\nいっせいに、ペラッと問題用紙がめくられる。\n\n教室の中は、カリカリ、カリカリと、鉛筆の音だけがひびいている。\n\nその中で、ひとりだけ、鉛筆がピタッと止まっている子がいるの。\n\nいつも、いちばんていねいにノートをとっている子。\n宿題も、毎回きちんと出してくる子。\n授業中に当てると、ちゃんと答えられる子です。\n\nなのに、テストになると、手が止まる。\n\nあとで答案を返すと、空欄だったところを、その子はすらすら解いてみせるんです。\n\n「わかってたの？」と聞くと、\n「・・・まちがえたらどうしようって思ったら、書けなくなって」\n\n最初のころの私は、その子に、もっと問題を解かせていました。\n練習すれば、自信がつくと思っていたから。\n\nでも、いくら問題を増やしても、テストの日になると、鉛筆はまた止まってしまう。\n\n変わったのは、ある日の放課後でした。\n\n夕方の教室。\n窓から、オレンジ色の光がさしこんでいて、遠くで吹奏楽部のトランペットが、パーッと鳴っていた。\n\nその子と、ふたりで話したんです。\n「まちがえたら、どうなると思う？」\n\nその子は、少し考えてから、ぽつりと言いました。\n「・・・お母さんが、がっかりする」\n\nああ、そうだったんだ、と思いました。\nこの子の鉛筆を止めていたのは、\n「がっかりさせたくない」という、やさしい気持ちだったんです。\n\nそのことを一緒に言葉にして、\n「まちがえても、お母さんはがっかりしないと思うよ」\nと話してから、その子の答案は、少しずつ埋まるようになりました。\n\n最初は、1問だけ。\n次のテストでは、3問。\n学期の終わりには、カリカリ、カリカリと、ほかの子と同じリズムで鉛筆が動いていました。\n\nテストを返す日、その子が答案を受け取って、ふっと笑ったんです。\n点数よりも、その笑顔のほうを、私は今でもよく覚えています。\n\n問題の数を増やしても変わらなかったのに、\n止まる理由に気づいたとたん、手が動きはじめた。\n\nあのとき、教えることと、ほどくことは、まったく別の力なんだと知りました。\n\n・・・起業してから、私は同じ光景にもう一度出会いました。\n\n学んでいる女性ほど、止まっている。\n\n資格もある。知識もある。\nお客様にも、ちゃんと喜ばれている。\nなのに、いちばん大事な場面で、鉛筆がピタッと止まる。\n\n実は、私自身もそうでした。\n起業したばかりのころ、「まだ足りない」と思って、講座を次々に受けていたんです。\n学んでいる間は、前に進んでいる気がして、安心できたから。\n\n新しい講座の案内が、ピロンとスマホに届くたびに、\n「これを学べば、きっと変われる」\nと、わくわくしながら申し込みボタンを押していました。\n\n手元のノートは、どんどん増えていく。\nでも、お客様の数は、なかなか増えなかったんです。\n\nでも、ふり返ってみると、足りなかったのは知識の量よりも、2つのことだったと思うの。\n\nひとつは、止まる理由に気づいて、そっとほどくこと。\nもうひとつは、学んできたことを、正しい順番で組み立て直すこと。\n\nこの2つがそろったとき、人は、がんばらなくても進めるようになります。\n\n寄り添いタイプの人の「聞く力」は、もう十分に育っています。\nあとは、それを生かす順番を知るだけ。\n\nたとえば、あるセラピストさん。\nお客様の話を、うんうん、とうなずきながら、1時間でも2時間でも聞ける方でした。\n\nでも、セッションの最後になると、決まって\n「また、いつでもどうぞ」\nで終わってしまう。\n\n1〜3通目でお話しした、あの場面です。\n\nこの方に必要だったのは、新しい資格よりも、\n「聞く力を、どの順番で生かすか」\nという地図でした。\n\nそれが見えたとたん、同じ聞く力が、\nお客様の「この先」を一緒に見る力に変わっていったんです。\n\nあなたの鉛筆が止まるのは、どんな場面でしょう。\n\n明日は、その「順番」のお話をします。\n口コミは、実は、いちばん最後に咲く花なんです。\n\n今日も読んでくれて、ありがとう。\n夕焼けがきれいな一日になりますように(^^)\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日は、「言いかけて、飲みこんだ一言」のお話をしました。<\/p>\n<p>今日は約束どおり、少しだけ私の話をさせてくださいね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私は、20年以上、教員をしていました。<\/p>\n<p>個別指導の塾も経営してきて、向き合ってきた生徒さんは、1万人を超えます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その中で、何度も見てきた光景があるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>テストの時間。<\/p>\n<p>キーンコーンカーンコーン、とチャイムが鳴って、<\/p>\n<p>いっせいに、ペラッと問題用紙がめくられる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>教室の中は、カリカリ、カリカリと、鉛筆の音だけがひびいている。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その中で、ひとりだけ、鉛筆がピタッと止まっている子がいるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>いつも、いちばんていねいにノートをとっている子。<\/p>\n<p>宿題も、毎回きちんと出してくる子。<\/p>\n<p>授業中に当てると、ちゃんと答えられる子です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>なのに、テストになると、手が止まる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あとで答案を返すと、空欄だったところを、その子はすらすら解いてみせるんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「わかってたの？」と聞くと、<\/p>\n<p>「・・・まちがえたらどうしようって思ったら、書けなくなって」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>最初のころの私は、その子に、もっと問題を解かせていました。<\/p>\n<p>練習すれば、自信がつくと思っていたから。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>でも、いくら問題を増やしても、テストの日になると、鉛筆はまた止まってしまう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>変わったのは、ある日の放課後でした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>夕方の教室。<\/p>\n<p>窓から、オレンジ色の光がさしこんでいて、遠くで吹奏楽部のトランペットが、パーッと鳴っていた。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その子と、ふたりで話したんです。<\/p>\n<p>「まちがえたら、どうなると思う？」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その子は、少し考えてから、ぽつりと言いました。<\/p>\n<p>「・・・お母さんが、 順番で生かすか」<\/p>\n<p>という地図でした。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>それが見えたとたん、同じ聞く力が、<\/p>\n<p>お客様の「この先」を一緒に見る力に変わっていったんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたの鉛筆が止まるのは、どんな場面でしょう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、その「順番」のお話をします。<\/p>\n<p>口コミは、実は、いちばん最後に咲く花なんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>夕焼けがきれいな一日になりますように(^^)<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1920}, {"n": 5, "day": "5日後", "subject": "口コミは、いちばん最後に咲く花", "text": "((friendly_name))\n\n美智代です。\n\n昨日は、放課後の教室のお話でした。\n今日は、「順番」のお話です。\n\nちょっと、庭で花を育てるところを思い浮かべてみてね。\n\n春に、きれいな花を咲かせたい。\nそう思ったら、まず何をするでしょう。\n\nザクッ、ザクッと、スコップで土をほりかえす。\nふかふかの土に、小さな種をそっとまく。\nじょうろで、シャーッと水をあげる。\n\nしばらくすると、土の中から、小さな芽がぴょこんと顔を出す。\n葉っぱが増えて、つぼみがふくらんで・・・\nある朝、ふわっと花がひらく。\n\n花は、いちばん最後なんです。\n\nところが、「口コミを増やしたい」と思ったとき、\n多くの人は、花の飾り方から探しはじめます。\n\n紹介キャンペーン。\nお客様の声の集め方。\nSNSでシェアしてもらうお願いの仕方。\n\nどれも、まちがってはいないの。\nでも、土や種がまだ整っていないところに、いくら飾りつけをしても、花は咲かないんです。\n\n口コミが自然に起きている人には、その前に、こんな順番があります。\n\n1つめ。自分が、なぜこの仕事をするのかという「軸」がある。\n花でいえば、日当たりのいい場所を選ぶこと。ここがずれると、何を植えても育ちにくいの。\n\n2つめ。お客様が申し込むまでの「流れ」を知っている。\n水やりの道すじです。どこに、いつ、どれくらい水をあげるかがわかっている。\n\n3つめ。「だれの、何を変えるのか」が、ひとことで言える。\n花壇に立てる名札のようなもの。通りかかった人が、「あ、ここは〇〇の花壇なんだ」とすぐにわかる。\n\n4つめ。商品が「お客様の変化」でできている。\nこれが、種そのものです。\n\n5つめ。自分に合った「届け方」をしている。\n植える季節を選ぶこと。春に強い花もあれば、秋に咲く花もあるの。\n\nこの順番が整うと、お客様は「変わった」と感じます。\nそして、自分の変化を、自分の言葉で、人に話しはじめるの。\nそれが、口コミという花です。\n\n寄り添いタイプの人が止まりやすいのは、4つめだと思っています。\n\nお客様を「楽」にするのは、とても上手。\nでも、商品が「楽になる時間」で終わっていて、「変わる道のり」になっていないことが多いんです。\n\n楽になる時間は、1回で終わります。\n変わる道のりには、3か月後の「最高の自分」がある。\n\n1〜3通目でお話しした「3か月後、どうなっていたら最高ですか？」は、\n実は、この4つめを整えるための質問でもあったの。\n\nちょっとだけ、ご自分の商品を思い浮かべてみてね。\n\n・お客様が受けたあと、何がどう変わるか、ひとことで言えますか？\n・その変化は、1回で終わりますか？　それとも、続いていきますか？\n・3か月後のお客様の姿を、思い浮かべられますか？\n\nもし、どれかで「うーん」と手が止まったなら、\nそこが、種を植え直すところなのかもしれません。\n\n手が止まったのは、気づけたしるし。\n気づけた人から、庭は少しずつ変わっていきます。\n\n私も、最初に作った商品は、1回きりのセッションでした。\n喜んでもらえる。でも、続かない。\n「楽になる時間」を売っていたんだと、あとになって気づきました。\n\nそこで、1回きりのセッションを、3か月の道のりに作り直したんです。\n\n1回目は、今の気持ちを、じっくり聞く。\n2回目は、3か月後の「最高の自分」を、一緒に言葉にする。\n3回目からは、そこに向かって、小さな一歩を確かめていく。\n\nやっていることは、ほとんど変わらないの。\n聞いて、受けとめて、一緒に考える。\n寄り添いタイプの得意なことばかりです。\n\nちがったのは、お客様の帰り道の表情でした。\n「楽になった」という顔から、\n「次に会うまでに、これをやってみよう」という顔に変わったんです。\n\nそして3か月後。\n「最近ね、こんなことができるようになったの」\nと、お客様のほうから、うれしそうに話してくれるようになりました。\n\nがんばる量は、もう十分です。\nあとは、土と種と水の順番を、組み立て直すだけ。\n\nあなたの庭では、今、どこまで育っているでしょう。\n\n明日は、この5つの順番を、5回で一緒に組み立てる講座のご案内をお送りします。\n今回は、モニターとしての募集です。\n\n今日も読んでくれて、ありがとう。\n小さな芽を見つけられる一日になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日は、放課後の教室のお話でした。<\/p>\n<p>今日は、「順番」のお話です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちょっと、庭で花を育てるところを思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>春に、きれいな花を咲かせたい。<\/p>\n<p>そう思ったら、まず何をするでしょう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ザクッ、ザクッと、スコップで土をほりかえす。<\/p>\n<p>ふかふかの土に、小さな種をそっとまく。<\/p>\n<p>じょうろで、シャーッと水をあげる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>しばらくすると、土の中から、小さな芽がぴょこんと顔を出す。<\/p>\n<p>葉っぱが増えて、つぼみがふくらんで・・・<\/p>\n<p>ある朝、ふわっと花がひらく。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>花は、いちばん最後なんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ところが、「口コミを増やしたい」と思ったとき、<\/p>\n<p>多くの人は、花の飾り方から探しはじめます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>紹介キャンペーン。<\/p>\n<p>お客様の声の集め方。<\/p>\n<p>SNSでシェアしてもらうお願いの仕方。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>どれも、まちがってはいないの。<\/p>\n<p>でも、土や種がまだ整っていないところに、いくら飾りつけをしても、花は咲かないんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>口コミが自然に起きている人には、その前に、こんな順番があります。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1つめ。自分が、なぜこの仕事をするのかという「軸」がある。<\/p>\n<p>花でいえば、日当たりのいい場所を選ぶこと。ここがずれると、何を植えても育ちにくいの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>2つめ。お客様が申し込むまでの「流れ」を知っている。<\/p>\n<p>水やりの道すじです。どこに、いつ、どれくらい水をあげるかがわかっている。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>3つめ。「だれの、何を変えるのか」が、ひとことで言える。<\/p>\n<p>花壇に立てる名札のようなもの。通りかかった人が、「あ、ここは〇〇の花壇なんだ」とすぐにわかる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>4つめ。商品が「お客様の変化」でできている。<\/p>\n<p>これが、種そのものです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>5つめ。自分に合った「届け方」をしている。<\/p>\n<p>植える季節を選ぶこと。春に強い花もあれば、秋に咲く花もあるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>この順番が整うと、お客様は「変わった」と感じます。<\/p>\n<p>そして、自分の変化を、自分の言葉で、人に話しはじめるの。<\/p>\n<p>それが、口コミという花です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>寄り添いタイプの人が止まりやすいのは、4つめだと思っています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>お客様を「楽」にするのは、とても上手。<\/p>\n<p>でも、商品が「楽になる時間」で終わっていて、「変わる道のり」になっていないことが多いんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>楽になる時間は、1回で終わります。<\/p>\n<p>変わる道のりには、3か月後の「最高の自分」がある。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1〜3通目でお話しした「3か月後、どうなっていたら最高ですか？」は、<\/p>\n<p>実は、この4つめを整えるための質問でもあったの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちょっとだけ、ご自分の商品を思い浮かべてみてね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>・お客様が受けたあと、何がどう変わるか、ひとことで言えますか？<\/p>\n<p>・その変化は、1回で終わりますか？　それとも、続いていきますか？<\/p>\n<p>・3か月後のお客様の姿を、思い浮かべられますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もし、どれかで「うーん」と手が止まったなら、<\/p>\n<p>そこが、種を植え直すところなのかもしれません。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>手が止まったのは、気づけたしるし。<\/p>\n<p>気づけた人から、庭は少しずつ変わっていきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>私も、最初に作った商品は、1回きりのセッションでした。<\/p>\n<p>喜んでもらえる。でも、続かない。<\/p>\n<p>「楽になる時間」を売っていたんだと、あとになって気づきました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そこで、1回きりのセッションを、3か月の道のりに作り直したんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1回目は、今の気持ちを、じっくり聞く。<\/p>\n<p>2回目は、3か月後の「最高の自分」を、一緒に言葉にする。<\/p>\n<p>3回目からは、そこに向かって、小さな一歩を確かめていく。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>やっていることは、ほとんど変わらないの。<\/p>\n<p>聞いて、受けとめて、一緒に考える。<\/p>\n<p>寄り添いタイプの得意なことばかりです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ちがったのは、お客様の帰り道の表情でした。<\/p>\n<p>「楽になった」という顔から、<\/p>\n<p>「次に会うまでに、これをやってみよう」という顔に変わったんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そして3か月後。<\/p>\n<p>「最近ね、こんなことができるようになったの」<\/p>\n<p>と、お客様のほうから、うれしそうに話してくれるようになりました。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>がんばる量は、もう十分です。<\/p>\n<p>あとは、土と種と水の順番を、組み立て直すだけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あなたの庭では、今、どこまで育っているでしょう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、この5つの順番を、5回で一緒に組み立てる講座のご案内をお送りします。<\/p>\n<p>今回は、モニターとしての募集です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>小さな芽を見つけられる一日になりますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1837}, {"n": 6, "day": "6日後", "subject": "【ご案内】起業５ステップ講座 モニター募集", "text": "((friendly_name))\n\n美智代です。\n今日は、昨日お約束したご案内です。\n\nその前に、ひとつだけ。\n\nはじめての場所へ車で行くとき、地図アプリを使いますよね。\n行き先を入れると、ピコンと音がして、道すじが青い線でスッと引かれる。\n\n「300メートル先、右です」\n\nあの声があるから、知らない道でも、安心して進めるの。\n\nもし、地図アプリがなかったら・・・。\n目的地はわかっているのに、どの角を曲がればいいのかわからない。\n同じ交差点を、ぐるぐる回ってしまう。\n\n起業も、少し似ていると思うんです。\n\n行きたい場所は、もうはっきりしている。\n学んできたことも、たくさんある。\n足りないのは、「次は、ここを右」という道すじだけ。\n\nその道すじを、5回で一緒に引いていくのが、この講座です。\n\n起業５ステップ講座\nすでに動いているのに、結果につながらないあなたへ。\n\nこんな方に、受けてほしいと思っています。\n・資格も学びもあるのに、紹介や申し込みにつながらない\n・お客様に喜ばれているのに、次が続かない\n・売り込むのは苦手。でも、自分の力で収入を作りたい\n・何から手をつければいいのか、順番を知りたい\n\nすでに学び、動いてきた方が、バラバラになった知識を、正しい順番に並べ直すための講座です。\n\n5回の中身\nSTEP1　起業の軸を作る\nSTEP2　ビジネスの基本と、行動を止める「マインドの壁」をほどく\nSTEP3　だれの、何を変えるのかを決める（コンセプト）\nSTEP4　お客様の変化でできた商品を作る\nSTEP5　自分に合った届け方を決める\n\n昨日お話しした、5つの順番そのままです。\n\n1回ごとに、ワークシートに書きこみながら進めます。\nカリカリとペンを走らせていくうちに、\n頭の中でもやもやしていたことが、1枚の紙の上に、すっと並んでいく。\nその感覚を、毎回味わってもらえると思います。\n\n5回を終えたとき、手元にあるもの\n・ぶれない起業の軸\n・ひとことで言えるコンセプト\n・お客様の変化を軸にした商品\n・自分に合った集客の型\n\nそして、「次に何をすればいいか」が、自分の言葉で言える状態です。\n\n内容\n・オンライン（Zoom）ライブ　全5回\n・ワークシート一式つき\n・60分の個別セッションつき\n\n参加費\n通常 66,000円 → モニター価格 33,000円（税込）\n\nモニター価格なのは、この形で講座を開くのが、今回がはじめてだからです。\nそのかわり、受講後に、正直なご感想をお聞かせください。\nいただいた声をもとに、次の講座をもっと良くしていきます。\n\n日程：【日程】\n締切：【締切日】\n定員：【定員】\n\n▼くわしく見る・申し込む\n【申込URL】\n\n寄り添いタイプの方には、とくに、60分の個別セッションを大切に使ってほしいと思っています。\n\n3通目でお話しした「言いかけて、飲みこんだ一言」。\nその一言を、どんな言葉で、どんなタイミングで伝えるか。\nあなたのお客様の顔を思い浮かべながら、一緒に考えます。\n\nそして、STEP2では、行動を止めているブレーキを、脳のしくみからほどいていきます。\nマインドチューニングのやり方も、ここでお伝えします。\n\n寄り添いタイプの方が、とくに変化を感じやすいのは、STEP4です。\n「楽になる時間」だった商品を、「変わる道のり」に作り直していきます。\n昨日お話しした、1回きりのセッションを3か月に作り直したときと同じ流れです。\n\n人の話をていねいに聞ける方ほど、商品を作り直したとたん、\nお客様の反応が、ぐっと変わっていくのを感じてもらえると思います。\n\nここまで読んで、\n「ちょっと気になる。でも、今の私で大丈夫かな」\nと思った方もいると思うの。\n\n明日は、申し込む前に知っておいてほしいことを、正直にお話ししますね。\n\n個別セッションでは、画面ごしに、ゆっくりお話を聞かせてください。\nお茶を片手に、コトン、とカップを置きながら、\n「最近、どんなお客様がいらっしゃいましたか？」\nというところから、はじめましょうね。\n\n診断を受けてくださった方に、最初にお知らせしています。\n\n今日も読んでくれて、ありがとう。\n迷わず進める一日になりますように。\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p>今日は、昨日お約束したご案内です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その前に、ひとつだけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>はじめての場所へ車で行くとき、地図アプリを使いますよね。<\/p>\n<p>行き先を入れると、ピコンと音がして、道すじが青い線でスッと引かれる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「300メートル先、右です」<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>あの声があるから、知らない道でも、安心して進めるの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>もし、地図アプリがなかったら・・・。<\/p>\n<p>目的地はわかっているのに、どの角を曲がればいいのかわからない。<\/p>\n<p>同じ交差点を、ぐるぐる回ってしまう。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>起業も、少し似ていると思うんです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>行きたい場所は、もうはっきりしている。<\/p>\n<p>学んできたことも、たくさんある。<\/p>\n<p>足りないのは、「次は、ここを右」という道すじだけ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>その道すじを、5回で一緒に引いていくのが、この講座です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>起業５ステップ講座<\/p>\n<p>すでに動いているのに、結果につながらないあなたへ。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>こんな方に、受けてほしいと思っています。<\/p>\n<p>・資格も学びもあるのに、紹介や申し込みにつながらない<\/p>\n<p>・お客様に喜ばれているのに、次が続かない<\/p>\n<p>・売り込むのは苦手。でも、自分の力で収入を作りたい<\/p>\n<p>・何から手をつければいいのか、順番を知りたい<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>すでに学び、動いてきた方が、バラバラになった知識を、正しい順番に並べ直すための講座です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>5回の中身<\/p>\n<p>STEP1　起業の軸を作る<\/p>\n<p>STEP2　ビジネスの基本と、行動を止める「マインドの壁」をほどく<\/p>\n<p>STEP3　だれの、何を変えるのかを決める（コンセプト）<\/p>\n<p>STEP4　お客様の変化でできた商品を作る<\/p>\n<p>STEP5　自分に合った届け方を決める<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>昨日お話しした、5つの順番そのままです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>1回ごとに、ワークシートに書きこみながら進めます。<\/p>\n<p>カリカリとペンを走らせていくうちに、<\/p>\n<p>頭の中でもやもやしていたことが、1枚の紙の上に、すっと並んでいく。<\/p>\n<p>その感覚を、毎回味わってもらえると思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>5回を終えたとき、手元にあるもの<\/p>\n<p>・ぶれない起業の軸<\/p>\n<p>・ひとことで言えるコンセプト<\/p>\n<p>・お客様の変化を軸にした商品<\/p>\n<p>・自分に合った集客の型<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そして、「次に何をすればいいか」が、自分の言葉で言える状態です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>内容<\/p>\n<p>・オンライン（Zoom）ライブ　全5回<\/p>\n<p>・ワークシート一式つき<\/p>\n<p>・60分の個別セッションつき<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>参加費<\/p>\n<p>通常 66,000円 → モニター価格 33,000円（税込）<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>モニター価格なのは、この形で講座を開くのが、今回がはじめてだからです。<\/p>\n<p>そのかわり、受講後に、正直なご感想をお聞かせください。<\/p>\n<p>いただいた声をもとに、次の講座をもっと良くしていきます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>日程：【日程】<\/p>\n<p>締切：【締切日】<\/p>\n<p>定員：【定員】<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>▼くわしく見る・申し込む<\/p>\n<p>【申込URL】<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>寄り添いタイプの方には、とくに、60分の個別セッションを大切に使ってほしいと思っています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>3通目でお話しした「言いかけて、飲みこんだ一言」。<\/p>\n<p>その一言を、どんな言葉で、どんなタイミングで伝えるか。<\/p>\n<p>あなたのお客様の顔を思い浮かべながら、一緒に考えます。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>そして、STEP2では、行動を止めているブレーキを、脳のしくみからほどいていきます。<\/p>\n<p>マインドチューニングのやり方も、ここでお伝えします。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>寄り添いタイプの方が、とくに変化を感じやすいのは、STEP4です。<\/p>\n<p>「楽になる時間」だった商品を、「変わる道のり」に作り直していきます。<\/p>\n<p>昨日お話しした、1回きりのセッションを3か月に作り直したときと同じ流れです。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>人の話をていねいに聞ける方ほど、商品を作り直したとたん、<\/p>\n<p>お客様の反応が、ぐっと変わっていくのを感じてもらえると思います。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>ここまで読んで、<\/p>\n<p>「ちょっと気になる。でも、今の私で大丈夫かな」<\/p>\n<p>と思った方もいると思うの。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>明日は、申し込む前に知っておいてほしいことを、正直にお話ししますね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>個別セッションでは、画面ごしに、ゆっくりお話を聞かせてください。<\/p>\n<p>お茶を片手に、コトン、とカップを置きながら、<\/p>\n<p>「最近、どんなお客様がいらっしゃいましたか？」<\/p>\n<p>というところから、はじめましょうね。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>診断を受けてくださった方に、最初にお知らせしています。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>今日も読んでくれて、ありがとう。<\/p>\n<p>迷わず進める一日になりますように。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>マインドチューニングマスター<\/p>\n<p>口コミ起業構築コンサルタント<\/p>\n<p>志田美智代<\/p>", "chars": 1795}, {"n": 7, "day": "7日後", "subject": "申し込む前に、正直にお伝えしたいこと", "text": "((friendly_name))\n\n美智代です。\n\n新しい靴を買ったときのこと、覚えていますか？\n\nお店で見たときは、すてきだなと思った。\nはいてみると、足にもぴったり。\nでも、レジに持っていく前に、もう一度だけ鏡の前に立って、\nコツ、コツ、と何歩か歩いてみる。\n\n「本当に、これでいいかな」\n\n大事なものを選ぶときほど、人は、もう一歩だけ確かめたくなるんです。\n\n講座も、同じだと思うの。\nだから今日は、申し込む前に気になりそうなことに、正直にお答えしますね。\n\nQ. もう十分学んできました。また同じ内容では？\n\nすでにある知識を、順番に並べ直す講座です。\n学んできた方ほど、「あれは、ここにつながっていたんだ」と、パズルのピースがカチッとはまる感覚があると思います。\n\nQ. また講座を受けても、行動できる気がしません。\n\nその気持ちが出てくること自体が、ブレーキのサインです。\n3通目でお話しした、あのサイドブレーキ。\nだからこの講座では、やり方と一緒に、「止まる理由」もほどいていきます。\n\nQ. 売り込みが苦手です。それでも大丈夫ですか？\n\n寄り添いタイプの方から、いちばん多くいただく声です。\n大丈夫です。\nこの講座でお伝えするのは、相手を大切に思う気持ちのまま、「この先」を一緒に見る伝え方です。\n押す言葉は、ひとつも使いません。\n\nQ. 毎回参加できるか不安です。\n\n【録画・見逃し配信の有無を記入】\n\nQ. パソコンやZoomに自信がありません。\n\nZoomは、送られてきたURLを、ポチッと押すだけで入れます。\n音が出ない、画面が映らない、というときも、はじまる前に一緒に確かめますので、安心してくださいね。\n\nQ. 個別セッションは、いつ受けられますか？\n\n【実施のタイミングを記入（講座中／講座後など）】\n\nQ. 家のことや仕事で、時間がとれるか心配です。\n\n講座は全5回です。\n1回ごとのワークは、ワークシートに書きこむ形なので、すきま時間にも進められます。\n台所でお湯がわくのを待つあいだに、1行だけ書く。\nそれくらいの小さな積み重ねで、大丈夫なように作っています。\n\n実は、私も、はじめて高い講座に申し込んだとき、申し込みボタンの上で、指が止まりました。\n画面の前で、5分くらい、ずっと迷っていたと思います。\n\nあのとき背中を押してくれたのは、\n「このまま1年たったら、私はどうなっているんだろう」\nという問いでした。\n\n1年後も、同じ悩みを、同じノートに書いている自分。\nそれを想像したとき、ふっと覚悟が決まって、カチッとボタンを押したのを覚えています。\n\n新しい靴と同じで、はいてみてはじめて、\n「ああ、これでよかったんだ」とわかることもあるの。\n\nそして、正直にお伝えします。\nこの講座は、こんな方には向きません。\n\n・だれかにやってもらうことを前提にしている方\n・情報を集めるだけで、行動はしない方\n・今すぐ楽に結果が出る方法を探している方\n\nQ. 「モニター」は、何をすればいいですか？\n\n講座を受けたあとに、感想をお聞かせいただくだけです。\n「ここがわかりやすかった」「ここはもう少し聞きたかった」\nそんな正直な声が、次の講座をつくる大切な材料になります。\n\n反対に、\n自分に投資する覚悟があって、\n自分の力で収入を作りたいと思っている方には、\n5回で、見える景色が変わる講座です。\n\nあなたが1年後、どんな顔でお客様を見送っていたいか。\n一度だけ、思い浮かべてみてね。\n\n「楽になりました」と笑うお客様に、\n「3か月後、楽しみですね」と、自然に返せている自分。\nお客様の未来の話を聞くのが、うれしくてたまらない自分。\n\nその姿が少しでも浮かんだなら、きっと、もう準備はできていると思うの。\n\nもちろん、迷う気持ちがあって当然です。\n大事なお金と、大事な時間を使うことですから。\nだからこそ、納得して選んでほしいと思っています。\n\n締切は【締切日】です。\n\n▼くわしく見る・申し込む\n【申込URL】\n\n今日も読んでくれて、ありがとう。\n足どりの軽い一日になりますように(^^)\n\nマインドチューニングマスター\n口コミ起業構築コンサルタント\n志田美智代", "html": "<p>((friendly_name))<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>美智代です。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>新しい靴を買ったときのこと、覚えていますか？<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>お店で見たときは、すてきだなと思った。<\/p>\n<p>はいてみると、足にもぴったり。<\/p>\n<p>でも、レジに持っていく前に、もう一度だけ鏡の前に立って、<\/p>\n<p>コツ、コツ、と何歩か歩いてみる。<\/p>\n<p><br /><\/p>\n<p><br /><\/p>\n<p>「本当に、これでいいかな」<\/p>\n<p><br /><
