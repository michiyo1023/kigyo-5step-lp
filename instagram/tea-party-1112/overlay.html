<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お茶会 告知画像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f1e7; --ink:#4a3526; --accent:#c0673f; --line:#d9cdb8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Zen Maru Gothic", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .panel { display:grid; gap:12px; margin-bottom:16px; font-size:14px; }
  label { display:grid; gap:4px; }
  input[type=text] { padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  canvas { width:100%; height:auto; display:block; border-radius:6px; box-shadow:0 1px 6px rgba(0,0,0,.12); }
  .note { font-size:12px; opacity:.75; }
</style>
</head>
<body>
<main>
  <h1>お茶会 告知画像（1080×1350）</h1>
  <div class="panel">
    <label>① 写真を選ぶ<input type="file" id="file" accept="image/*"></label>
    <label>大きい文字<input type="text" id="title" value="お茶会"></label>
    <label>日付<input type="text" id="date" value="11月12日（木）"></label>
    <div class="row">
      <label>文字の色
        <select id="color">
          <option value="dark">こげ茶（明るい写真向き）</option>
          <option value="light">白（暗めの写真向き）</option>
        </select>
      </label>
      <label>文字の高さ <input type="range" id="y" min="60" max="420" value="150"></label>
    </div>
    <label class="row"><input type="checkbox" id="guide" checked> 下部の余白ガイドを表示（保存画像には入りません）</label>
    <div class="row"><button id="save">② PNGで保存</button></div>
    <p class="note">点線より下が「時間・場所・申込」を入れるスペースです。写真の下側に物が写り込んでいたら、生成AIに作り直してもらってください。</p>
  </div>
  <canvas id="c" width="1080" height="1350"></canvas>
</main>
<script>
const W = 1080, H = 1350, RESERVED = 0.25; // 下25%は後で文字を入れる余白
const c = document.getElementById('c'), ctx = c.getContext('2d');
const $ = id => document.getElementById(id);
let img = null;

function drawPhoto() {
  if (!img) {
    ctx.fillStyle = '#efe6d6'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#b9a88f'; ctx.font = '500 36px "Zen Maru Gothic", sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('ここに写真が入ります', W / 2, H / 2);
    return;
  }
  // 4:5 に合わせて中央トリミング
  const s = Math.max(W / img.width, H / img.height);
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
}

function draw(withGuide) {
  drawPhoto();
  const dark = $('color').value === 'dark';
  const ink = dark ? '#4a3526' : '#ffffff';
  const accent = dark ? '#c0673f' : '#ffffff';
  const y = +$('y').value;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  // 左寄せ・少しだけ崩した配置（完全な中央揃えにしない）
  const x = 96;
  ctx.shadowColor = dark ? 'rgba(255,250,240,.55)' : 'rgba(40,25,15,.35)';
  ctx.shadowBlur = 18;

  ctx.fillStyle = accent;
  ctx.font = '700 46px "Zen Maru Gothic", sans-serif';
  ctx.fillText($('date').value, x + 6, y);

  ctx.fillStyle = ink;
  ctx.font = '700 168px "Zen Maru Gothic", sans-serif';
  ctx.fillText($('title').value, x, y + 180);

  // 日付の下に短い差し色ライン
  ctx.shadowBlur = 0;
  ctx.fillStyle = accent;
  ctx.fillRect(x + 8, y + 24, 72, 5);

  if (withGuide && $('guide').checked) {
    ctx.setLineDash([14, 10]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(192,103,63,.8)';
    const gy = H * (1 - RESERVED);
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); ctx.setLineDash([]);
  }
}

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const i = new Image();
  i.onload = () => { img = i; draw(true); };
  i.src = URL.createObjectURL(f);
});
['title', 'date', 'color', 'y', 'guide'].forEach(id => $(id).addEventListener('input', () => draw(true)));
$('save').addEventListener('click', () => {
  draw(false);
  const a = document.createElement('a');
  a.download = 'ochakai-1112.png';
  a.href = c.toDataURL('image/png');
  a.click();
  draw(true);
});
document.fonts.load('700 168px "Zen Maru Gothic"').finally(() => draw(true));
draw(true);
</script>
</body>
</html>
